---
all:
  children:
    compute_servers:
      hosts:
        max:
          ansible_host: 192.168.1.100
          ansible_port: 6768
          ansible_user: justin
          server_role: local_llm
          known_hosts: max
          # GPU Config
          # 3x RTX Pro 6000 Blackwell after the 2026-06-01 rebuild:
          #   index 0,1: Max-Q Workstation Edition (300 W) at 21:00 / C1:00
          #   index 2:   full Workstation Edition (600 W, limited to 300 W by
          #              roles/gpu_tools) at F1:00
          # Bus addresses as of the 2026-10-24 move to the ASUS Pro WS
          # WRX90E-SAGE SE board; the index order did not change.
          # See roles/ai/defaults/main.yml ai_gpu_mode for how llama-swap
          # and sglang pin specific cards.
          gpu_type: nvidia
          gpu_model: rtx_pro_6000_blackwell
          gpu_count: 3
          gpu_vram_gb: 288
          docker_gpu: true
          docker_runtime: nvidia
          docker_devices:
            - /dev/nvidia0:/dev/nvidia0
            - /dev/nvidia1:/dev/nvidia1
            - /dev/nvidia2:/dev/nvidia2
            - /dev/nvidiactl:/dev/nvidiactl
            - /dev/nvidia-uvm:/dev/nvidia-uvm
          # Standalone Komodo Periphery agent (roles/infra_periphery)
          firewall_group_komodo_periphery: true
          # Emulator streaming containers (roles/pcsx2, roles/dolphin)
          firewall_group_emulator_streaming: true
          # Second NVMe: Samsung 990 PRO 4TB, ext4 at /mnt/storage, holding
          # model weights. roles/model_storage manages the mount. Root stays
          # on the 2TB 990 PRO.
          model_storage_mount_src: UUID=28cda4e3-000b-451f-8d63-def6c838ee08
          beszel_agent_extra_filesystems:
            - source: /mnt/storage/.beszel
              name: nvme1n1p1__Storage
        nuc-mini:
          ansible_host: 192.168.1.6
          ansible_user: justin
          ansible_port: 6895
          server_role: compute
          known_hosts: nuc
          netdata_role: parent
          # GPU Config
          gpu_type: intel_arc
          gpu_model: arc_graphics # Core Ultra 7 255H Integrated
          docker_gpu: true
          docker_runtime: runc
          docker_devices:
            - /dev/dri:/dev/dri # Intel Arc + QuickSync
          # Capabilities
          has_npu: true
          npu_tops: 96
          supports_av1_encode: true
          # Pin traefik to the primary LAN IP so other host services
          # (kibble's per-feeder ONVIF VIPs at .184/.185) can bind
          # their own :80 listeners on alias IPs without colliding
          # with a 0.0.0.0:80 docker-proxy bind.
          traefik_bind_ip: 192.168.1.6
          # Preserve the observed proxy-network address across recreation.
          # Album Sort trusts this host only; changing it requires its redeploy.
          traefik_proxy_ipv4_address: 172.18.0.43
        mac-mini:
          # ssh known_hosts: `mac`
          ansible_host: 192.168.1.7
          ansible_user: justin
          # Active host (GitLab macOS runner, paseo daemon), just
          # not a Docker host. skip_prerequisites keeps it out of the
          # Docker/UFW/NFS prerequisites play (see deploy/prerequisites.yml).
          server_role: macos_native
          known_hosts: mac
          # GPU Config
          gpu_type: apple_silicon
          gpu_model: m4
          docker_gpu: false # macOS doesn't support virtualization in containers
          docker_runtime: runc
          skip_prerequisites: true
        gaming-pc:
          # ssh known_hosts: `pc`
          ansible_host: 192.168.1.12
          ansible_port: 6895
          ansible_user: justin
          # CachyOS (Arch) desktop, often off or booted into Windows. Only
          # the Beszel agent and Komodo Periphery are managed here. The
          # prerequisites roles are apt-based, so Docker, the NVIDIA
          # container toolkit, and UFW are set up by hand; see
          # roles/infra_periphery/README.md.
          server_role: desktop
          known_hosts: pc
          skip_prerequisites: true
          # GPU Config
          gpu_type: nvidia
          gpu_model: rtx_5090
          gpu_count: 1
          gpu_vram_gb: 32

    # Retained logging backend and host collectors.
    logging:
      hosts:
        nuc-mini:

    vector:
      hosts:
        nuc-mini:
          vector_extra_files:
            - /host/gitlab/**/*.log
            - /host/gitlab/**/current
            - /host/traefik/*.log
        max:
        mac-mini:
        gaming-pc:
        dokploy-vm:
          vector_extra_files:
            - /host/dokploy-traefik/access.log

