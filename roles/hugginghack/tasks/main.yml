---
# HuggingHack stack: Hugging Face model browser/downloader on nuc-mini.
# The hugginghack-models NFS volume is created by the docker-volumes role
# (group_vars/compute_servers/storage.yml); run deploy-prerequisites first
# on a fresh setup. Create HuggingHack at the visible Files share root (the
# internal export path is Files/.data/HuggingHack) and make it writable by
# {{ puid }}:{{ pgid }}.

- name: Validate HuggingHack database and PocketID configuration
  ansible.builtin.assert:
    that:
      - hugginghack_db_password | length >= 32
      - hugginghack_oidc_client_id | length > 0
      - hugginghack_oidc_client_secret | length > 0
      - hugginghack_legacy_owner_username | length >= 3
      - >-
        hugginghack_legacy_owner_username
        is match('^[a-z0-9][a-z0-9_-]{1,30}[a-z0-9]$')
    fail_msg: >-
      Populate the HuggingHack PostgreSQL and PocketID vault values and set a
      valid PocketID preferred username before deploying.
  tags:
    - preflight

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"

- name: Create {{ stack_name }} data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: '0755'
  loop:
    - "{{ config_base }}/data"
    - "{{ config_base }}/data/.cache/huggingface"

- name: Ensure {{ stack_name }} owns existing data
  ansible.builtin.file:
    path: "{{ config_base }}/data"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    recurse: true

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy environment file
  ansible.builtin.template:
    src: env/hugginghack.env.j2
    dest: "{{ config_base }}/env/hugginghack.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true

- name: Deploy PostgreSQL environment file
  ansible.builtin.template:
    src: env/postgres.env.j2
    dest: "{{ config_base }}/env/postgres.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true

- name: Check for the existing SQLite database
  ansible.builtin.stat:
    path: "{{ config_base }}/data/hugginghack.sqlite3"
  register: hugginghack_sqlite_database

- name: Start only HuggingHack PostgreSQL
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    services:
      - hugginghack-postgres
    state: present
    pull: "{{ docker_pull_policy | default('missing') }}"
    wait: true
    wait_timeout: 120

- name: Build the latest HuggingHack fork image
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - build
      - hugginghack
    chdir: "{{ config_base }}"
  changed_when: false

- name: Verify retained PostgreSQL owner before every application start
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hugginghack-postgres
      - psql
      - -tA
      - -U
      - "{{ hugginghack_db_user }}"
      - -d
      - "{{ hugginghack_db_name }}"
      - -c
      - >-
        SELECT COUNT(*) FROM users
        WHERE id = '{{ hugginghack_legacy_user_id }}'
          AND username = '{{ hugginghack_legacy_owner_username }}';
  when:
    - not ansible_check_mode
    - hugginghack_sqlite_database.stat.exists
  register: hugginghack_retained_owner
  changed_when: false

- name: Refuse to start without the retained owner
  ansible.builtin.assert:
    that:
      - hugginghack_retained_owner.stdout | trim == '1'
    fail_msg: >-
      The migrated PostgreSQL owner is missing or has the wrong username.
      HuggingHack remains stopped so PocketID cannot provision a replacement
      account disconnected from the existing data.
  when:
    - not ansible_check_mode
    - hugginghack_sqlite_database.stat.exists

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    build: policy
    pull: "{{ docker_pull_policy | default('missing') }}"
    wait: true
    wait_timeout: 180

- name: Verify PostgreSQL, PocketID, and filesystem storage health
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hugginghack
      - python
      - -c
      - >-
        import json, urllib.request;
        data = json.load(urllib.request.urlopen(
          'http://127.0.0.1:{{ hugginghack_container_port }}/api/health', timeout=5));
        assert data['database_backend'] == 'postgresql';
        assert data['auth_mode'] == 'oidc';
        assert data['object_storage']['backend'] == 'filesystem';
        print(json.dumps({
          'database': data['database_backend'],
          'auth': data['auth_mode'],
          'storage': data['object_storage']['backend'],
        }, sort_keys=True))
  changed_when: false
