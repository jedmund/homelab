---
# Stack identity
stack_name: stereo
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Stereo images are built by GitLab CI and published as a short SHA, branch
# slug, and `latest`. `latest` is published only from the default branch, then CI
# calls Komodo to redeploy this stack. Set this to a short SHA for a deploy freeze
# or rollback.
stereo_image: registry.atelier.house/jedmund/stereo-app
stereo_beets_image: registry.atelier.house/jedmund/stereo-app/beets
stereo_embedder_image: registry.atelier.house/jedmund/stereo-app/embedder
stereo_image_tag: latest
stereo_registry_url: https://registry.atelier.house
stereo_registry_username: "{{ vault_stereo_registry_username | default('') }}"
stereo_registry_password: "{{ vault_stereo_registry_password | default('') }}"
stereo_container_port: 3000
stereo_domain: music.atelier.house
# The old address, redirected permanently to stereo_domain so existing
# bookmarks, OpenSubsonic clients and scrobblers keep working. Empty disables it.
stereo_legacy_domain: music.sort.atelier.house
stereo_origin: "https://{{ stereo_domain }}"
stereo_unsorted_path: /music/Sort
stereo_sorted_path: /music/Sorted
stereo_data_path: /data
# Acquisition handoff on the shared Ingest volume: slskd's and qBittorrent's
# finished downloads (read only by Stereo) and Stereo's quarantine for
# intake review. qBittorrent saves Stereo's torrents under its `stereo`
# category folder. The quarantine sits beside the download roots, never inside
# them, on the same volume so handoff can hardlink.
stereo_slskd_download_path: /downloads/music
stereo_qbittorrent_download_path: /downloads/stereo
stereo_quarantine_path: /downloads/stereo-quarantine
stereo_watch_interval: "30000"
stereo_scan_concurrency: "4"
# Bounded per-file preparation; copies may not exceed staging workers.
stereo_tag_preflight_concurrency: "1"
stereo_tag_staging_concurrency: "1"
stereo_tag_copy_concurrency: "1"
stereo_musicbrainz_base_url: "http://musicbrainz:5000/ws/2"
stereo_cover_art_archive_base_url: "https://coverartarchive.org"
stereo_auth_required: "true"
stereo_mutations_enabled: "true"
stereo_oidc_issuer_url: "https://id.atelier.house"
stereo_oidc_client_id: "{{ vault_stereo_oidc_client_id | default('') }}"
stereo_oidc_client_secret: "{{ vault_stereo_oidc_client_secret | default('') }}"
stereo_session_ttl_hours: "12"

# PostgreSQL, staged ahead of the SQLite -> Postgres cutover. The SQLite-era
# app ignores DATABASE_URL, so the empty database can run beside it. The app
# refuses a database that is not libc C locale with UTF8 encoding, so initdb
# must create the cluster that way; changing these args after first start has
# no effect on an existing data directory.
stereo_postgres_image: postgres:17-alpine
stereo_postgres_db: stereo
stereo_postgres_user: stereo
stereo_postgres_password: "{{ vault_stereo_postgres_password | default('') }}"
stereo_postgres_initdb_args: "--locale=C --encoding=UTF8"
# A clean shutdown drains in-flight sorts; the worst case is about 46 s.
stereo_stop_grace_period: 60s

# Audio-embedding sidecar for similarity (Sonic Adventure). It reads the music
# volume only and needs no internet, so it sits on the internal backend network.
stereo_embedder_enabled: true
stereo_embedder_threads: "2"
stereo_embedder_cpus: 2
stereo_embedder_mem_limit: 2g

# The app signs people in itself with Pocket ID (OIDC, callback
# https://music.atelier.house/auth/callback), for the browser and the native
# apps alike. TinyAuth in front of it blocks the native apps' API and sign-in
# endpoints, so it stays off.
stereo_use_tinyauth: false

# OpenSubsonic REST API (`/rest`). Music clients authenticate per-request with
# the Subsonic protocol's own credentials, so this path must bypass the outer
# tinyauth middleware: tinyauth's browser SSO flow rejects them before the app
# ever sees the request. Setting this false removes the bypass router and takes
# every OpenSubsonic client offline.
stereo_expose_rest_api: true

# Persistent canonical base64 of 32 random bytes. Never generate on deployment:
# losing/changing this key invalidates named legacy client credentials.
stereo_user_secret_encryption_key: "{{ vault_stereo_user_secret_encryption_key | default('') }}"

# Peers whose X-Forwarded-Proto Stereo may trust when deciding whether a
# /rest request arrived over TLS. Traefik terminates TLS and forwards an
# internal HTTP hop, so this assertion is the only way a production request
# satisfies the transport predicate: under adapter-node the request URL scheme
# is derived from ORIGIN, not from the socket, so it is not a transport fact.
# Trusting a peer lets it assert transport only; it never authenticates.
#
# The role resolves the actual Traefik address to /32 and fails if absent.
# Pin Traefik's proxy address in inventory so recreation cannot stale this trust.
stereo_trusted_proxy_cidrs: ""

# Multi-Scrobbler integration
stereo_multi_scrobbler_url: "http://multi-scrobbler:9078"

# Secrets defined in vault:
# stereo_apple_music_team_id, stereo_apple_music_key_id,
# stereo_apple_music_private_key, stereo_discogs_token,
# stereo_lastfm_api_key (optional),
# vault_stereo_registry_username, vault_stereo_registry_password,
# vault_stereo_oidc_client_id,
# vault_stereo_oidc_client_secret,
# vault_stereo_user_secret_encryption_key,
# vault_stereo_postgres_password

# Opt-in registry setup for the independent private Storybook catalog.
# Its Docker config must never replace Kizuna's /etc/komodo/docker login.
stereo_storybook_registry_enabled: false
stereo_storybook_registry_username: "{{ vault_stereo_storybook_registry_username | default('') }}"
stereo_storybook_registry_password: "{{ vault_stereo_storybook_registry_password | default('') }}"
