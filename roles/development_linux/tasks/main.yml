---
# Development (Linux) stack: GitLab Runner with the Docker executor on max.

# CI jobs (Vite/Vitest, webpack, tsc --watch, etc.) each open many per-file
# inotify watchers. See gitlab_runner_linux_inotify_max_user_instances in
# defaults for why the kernel default of 128 is not survivable. Applied via
# a sysctl.d drop-in so it persists across reboots.
- name: Raise inotify instance limit for CI runner file watchers
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "{{ gitlab_runner_linux_inotify_max_user_instances }}"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-gitlab-runner-inotify.conf

- name: Pin GitLab endpoints on runner host
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK: GitLab runner endpoints"
    block: |
      {{ gitlab_runner_linux_host_ip }} {{ gitlab_domain }}
      {{ gitlab_runner_linux_host_ip }} {{ gitlab_registry_domain }}
  tags:
    - runner_dns

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/runner"
    - "{{ config_base }}/runner/config"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  # The docker_compose_v2 task below applies image and compose changes. A
  # handler here would immediately recreate the freshly deployed runner again.

- name: Deploy GitLab Runner config
  ansible.builtin.template:
    src: gitlab-runner/config.toml.j2
    dest: "{{ config_base }}/runner/config/config.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  # GitLab Runner watches config.toml and hot-reloads changes. Avoid
  # interrupting in-flight jobs when concurrency, cache, or limits change.

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"

# Runner tags are registration metadata held by GitLab, so config.toml cannot
# declare them. Reconcile only after the runner config (including distributed
# cache) is in place; otherwise a pnpm-cache job could land here before this
# host has the cache that its offline install requires.
- name: Reconcile max GitLab Runner scheduling metadata
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - gitlab-rails
      - runner
      - >-
        runner = Ci::Runner.find_by(id: {{ gitlab_runner_linux_id }});
        if runner.nil?
          puts 'SKIPPED runner {{ gitlab_runner_linux_id }} is not registered';
        else
          desired_tags = {{ gitlab_runner_linux_tags | to_json }}.sort;
          desired_untagged = {{ gitlab_runner_linux_run_untagged | bool | ternary('true', 'false') }};
          changed = runner.tag_list.to_a.sort != desired_tags || runner.run_untagged != desired_untagged;
          if changed
            runner.tag_list = desired_tags;
            runner.run_untagged = desired_untagged;
            runner.save!;
          end;
          puts changed ? 'CHANGED runner scheduling metadata' : 'OK no changes';
        end
  delegate_to: nuc-mini
  register: gitlab_runner_linux_metadata
  changed_when: "'CHANGED' in gitlab_runner_linux_metadata.stdout"
