---
# Development (Linux) stack: a GitLab Runner with the Docker executor,
# deployed to max. Parallels roles/development_macos (the mac-mini shell
# runner for Xcode builds); this is the Linux/Docker counterpart.
#
# Exists because nuc-mini, which hosts GitLab itself plus ~50 other
# stacks, sits near its load ceiling and cannot absorb more concurrent CI
# without starving those services. max is a 32-thread Threadripper Pro
# whose CPU is almost entirely idle (the LLM work happens on the GPUs),
# so CI capacity is close to free there.

# Stack identity
stack_name: development_linux
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Vault secrets consumed by this role:
#   gitlab_runner_linux_auth_token
#   gitlab_runner_linux_large_auth_token

# Runner image. Kept in step with roles/gitlab's runner and the GitLab
# server itself; a runner on a newer major/minor than the server is
# unsupported. The patch level may differ, and does here: the runner's
# newest 19.3 patch is v19.3.3 while the server sits on 19.3.2.
gitlab_runner_linux_image: gitlab/gitlab-runner:v19.3.3

# Runner identity. Derived from the host so adding a second Linux runner
# is just an inventory change. Registers in GitLab as `max-docker`,
# alongside `nuc-mini-docker` and `mac-mini-xcode`. The GitLab runner ID is
# already a stable config-as-code dependency (Gatus monitors the same ID).
gitlab_runner_linux_name: "{{ inventory_hostname }}-docker"
gitlab_runner_linux_id: 3

# Scheduling metadata lives in GitLab's database, not config.toml. Reconcile
# it after deploying the runner so cache-dependent Kizuna App jobs can use
# max as well as nuc-mini. The pnpm-cache tag is safe only because this role
# configures the same shared Garage S3 cache used by the nuc-mini runner.
gitlab_runner_linux_tags:
  - amd64
  - atelier-max
  - docker
  - linux
  - pnpm-cache
gitlab_runner_linux_run_untagged: true

# Concurrency. Two runner entries share this process: the general pool
# (max-docker, 4 jobs capped at 3 CPUs / 6 GB each) and the large pool
# (max-docker-large, 2 jobs capped at 12 CPUs / 24 GB each) for suites that
# parallelize, such as album-sort's Vitest run. A single 3-CPU job cannot
# use this host: album-sort's suite took 16-26 minutes across three 3-CPU
# shards and under 4 minutes in one 16-CPU container.
#
# Worst case is 36 CPUs of quota on 32 threads and 60 GB of RAM. Docker's
# cpus setting is a CFS quota, not pinning, so the host is only
# oversubscribed when all six jobs peak together; normal mixed CI still
# leaves room for vLLM's CPU-side work (tokenization, sampling, and
# dataloading). The host has 125 GB of RAM and normally about 90 GB free.
# concurrent must cover the sum of both limits.
gitlab_runner_linux_limit: 4
gitlab_runner_linux_cpus: "3"
gitlab_runner_linux_memory: 6g
gitlab_runner_linux_tmpfs_size: 2g
gitlab_runner_linux_concurrent: "{{ gitlab_runner_linux_limit + gitlab_runner_linux_large_limit }}"

# Large pool. A separate GitLab runner registration, because tags and the
# untagged flag belong to the registration, not to config.toml. Tagged-only
# so ordinary jobs never occupy a 12-CPU slot. The entry is omitted from
# config.toml until its vault token exists, and metadata reconciliation
# skips it while the ID is 0.
gitlab_runner_linux_large_name: "{{ inventory_hostname }}-docker-large"
gitlab_runner_linux_large_id: 4
gitlab_runner_linux_large_tags:
  - amd64
  - atelier-max-large
  - docker
  - linux
  - pnpm-cache
gitlab_runner_linux_large_run_untagged: false
gitlab_runner_linux_large_limit: 2
gitlab_runner_linux_large_cpus: "12"
gitlab_runner_linux_large_memory: 24g
gitlab_runner_linux_large_tmpfs_size: 8g

# Job containers get a RAM-backed /tmp. Test suites that open SQLite
# databases under os.tmpdir() fsync constantly, and the NVMe drives here take
# about 5 ms per flush (no power-loss protection), which made album-sort's
# Vitest run 3.6x slower on the overlay filesystem than on tmpfs (237 s vs
# 66 s). tmpfs pages count against the job's memory limit, so each size
# stays well under its pool's cap; a job that outgrows it gets ENOSPC.

gitlab_runner_linux_default_image: alpine:latest
gitlab_runner_linux_log_level: info

# Unlike the nuc-mini runner, which reaches GitLab as `http://gitlab` over
# a shared Docker network, this host is remote and goes over the LAN
# through Traefik. Same approach as the macOS runner.
gitlab_runner_linux_url: "https://{{ gitlab_domain }}"

# Empty default lets a first deploy render config.toml without failing.
# The runner logs auth errors until the vault value is populated. Token
# comes from a separate runner registration in the GitLab admin UI, not
# from the nuc-mini or macOS runner's token.
gitlab_runner_linux_auth_token: ""
gitlab_runner_linux_large_auth_token: ""

# Pin the GitLab hostnames to nuc-mini directly. The host mapping covers
# Docker image pulls, which resolve the registry before a job container and
# its extra_hosts entries exist. The extra_hosts mappings cover the runner
# and job containers themselves.
gitlab_runner_linux_host_ip: "{{ hostvars['nuc-mini'].ansible_host }}"
gitlab_runner_linux_extra_hosts:
  - "{{ gitlab_domain }}:{{ gitlab_runner_linux_host_ip }}"
  - "{{ gitlab_registry_domain }}:{{ gitlab_runner_linux_host_ip }}"

# GitLab server coordinates. Duplicated from roles/gitlab/defaults rather
# than shared, because that role is scoped to the nuc-mini host and its
# vars are not in scope here.
gitlab_domain: git.atelier.house
gitlab_registry_domain: registry.atelier.house

# Host inotify instance cap for CI file watchers. Kernel default is 128,
# which Vite/Vitest jobs blow past, and inotify_init() then returns EMFILE
# mid-job even though no fds are leaking (raising ulimit -n does not help,
# it is the instance cap and not the fd cap). Same fix roles/gitlab
# applies on nuc-mini, needed here for the same reason.
gitlab_runner_linux_inotify_max_user_instances: 1024
