---
- name: Reconcile the proxy network address plan
  ansible.builtin.import_tasks: proxy_ipam.yml
  when: proxy_network_ipam is defined

- name: Create Docker networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    driver: "{{ item.driver | default('bridge') }}"
    internal: "{{ item.internal | default(false) }}"
    # An empty list skips IPAM comparison. A non-empty list that differs from
    # the live network makes the module detach every container and recreate
    # it, so only pass a plan the network already matches or is created with.
    ipam_config: "{{ item.ipam_config | default(omit) }}"
    state: present
  loop:
    - name: "{{ proxy_network }}"
      driver: bridge
      ipam_config: "{{ networks_proxy_ipam_config | default([]) }}"
    - name: "{{ backend_network }}"
      driver: bridge
      internal: true
    - name: "{{ shared_network }}"
      driver: bridge
    - name: "{{ cibuild_network }}"
      driver: bridge
    - name: "{{ vpn_network | default('vpn-network') }}"
      driver: bridge

- name: Create Minecraft networks on assigned hosts
  community.docker.docker_network:
    name: "{{ item.name }}"
    internal: "{{ item.internal }}"
    state: present
  loop:
    - name: "{{ minecraft_network | default('minecraft-network') }}"
      internal: false
    - name: "{{ minecraft_control_network | default('minecraft-control') }}"
      internal: true
  when: inventory_hostname in groups.get('minecraft', [])
