---
# Gluetun product stack

- name: Validate gluetun inputs
  ansible.builtin.assert:
    that:
      - gluetun_wireguard_private_key | length == 44
      - gluetun_control_server_api_key | length >= 32
      - gluetun_forwarded_ports_count | int >= 1
      - gluetun_forwarded_ports_count | int <= 5
    fail_msg: >-
      Set vault_gluetun_wireguard_private_key (the PrivateKey of a ProtonVPN
      WireGuard configuration created with NAT-PMP) and
      vault_gluetun_control_server_api_key (at least 32 characters) in
      group_vars/gluetun/vault.yml. ProtonVPN forwards 1 to 5 ports.
    quiet: true
  tags:
    - preflight

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/config"
    - "{{ config_base }}/config/auth"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy environment file
  ansible.builtin.template:
    src: env/gluetun.env.j2
    dest: "{{ config_base }}/env/gluetun.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gluetun_deploy_environment_file

- name: Deploy control server roles
  ansible.builtin.template:
    src: config/auth.toml.j2
    dest: "{{ config_base }}/config/auth/config.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gluetun_deploy_control_server_roles

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (gluetun_deploy_environment_file.changed | default(false)) or
         (gluetun_deploy_control_server_roles.changed | default(false))
         else 'auto' }}
    # The clients are reconnected below only once the tunnel is up. Check
    # mode skips the wait: a dry run would judge the existing container.
    wait: "{{ not ansible_check_mode }}"
    wait_timeout: 300
  register: compose_result

# A client keeps the network namespace it joined at creation. When gluetun is
# recreated or restarted, the client is left with only a loopback interface
# until it is recreated.
- name: Read gluetun container
  community.docker.docker_container_info:
    name: gluetun
  register: gluetun_container

- name: Read VPN client containers
  community.docker.docker_container_info:
    name: "{{ item.container }}"
  loop: "{{ gluetun_clients }}"
  loop_control:
    label: "{{ item.container }}"
  register: gluetun_client_containers

- name: Read network namespaces of gluetun and its clients
  ansible.builtin.stat:
    path: "/proc/{{ item.container.State.Pid }}/ns/net"
    follow: false
    get_checksum: false
  loop: "{{ [gluetun_container] + gluetun_client_containers.results }}"
  loop_control:
    label: "{{ item.container.Name | default('absent') }}"
  when:
    - item.exists
    - item.container.State.Running
  register: gluetun_network_namespaces

- name: Recreate clients outside gluetun's network namespace
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ item.0.project }}"
      - up
      - --detach
      - --force-recreate
      - --pull
      - never
  loop: "{{ gluetun_clients | zip(gluetun_client_containers.results, gluetun_network_namespaces.results[1:]) | list }}"
  loop_control:
    label: "{{ item.0.container }}"
  when:
    - gluetun_container.exists
    - gluetun_container.container.State.Running
    - item.1.exists
    # A client still on its own network has not been deployed into the
    # namespace yet; its own role does that.
    - item.1.container.HostConfig.NetworkMode is match('container:')
    - >-
      item.1.container.HostConfig.NetworkMode != 'container:' ~ gluetun_container.container.Id
      or (item.1.container.State.Running and
          item.2.stat.lnk_target | default('') != gluetun_network_namespaces.results[0].stat.lnk_target | default(''))
  changed_when: true
