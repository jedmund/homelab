---
# Gluetun stack: the ProtonVPN tunnel and the download clients that use it

- name: Validate gluetun inputs
  ansible.builtin.assert:
    that:
      - gluetun_wireguard_private_key | length == 44
      - gluetun_control_server_api_key | length >= 32
      - gluetun_forwarded_ports_count | int >= 1
      - gluetun_forwarded_ports_count | int <= 5
    fail_msg: >-
      Set vault_gluetun_wireguard_private_key (the PrivateKey of a ProtonVPN
      WireGuard configuration created with NAT-PMP) and
      vault_gluetun_control_server_api_key (at least 32 characters) in
      group_vars/gluetun/vault.yml. ProtonVPN forwards 1 to 5 ports.
    quiet: true
  tags:
    - preflight

- name: Validate slskd inputs
  ansible.builtin.assert:
    that:
      - slskd_slsk_username | default('') | length > 0
      - slskd_slsk_password | default('') | length > 0
      - slskd_web_username | default('') | length > 0
      - slskd_web_password | default('') | length > 0
      - slskd_api_key | length == 0 or (slskd_api_key | length >= 16 and slskd_api_key | length <= 255)
      - "';' not in slskd_api_key"
      - slskd_api_key_role in ['ReadOnly', 'ReadWrite', 'Administrator']
      - slskd_api_key_cidr | length > 0
      - "';' not in slskd_api_key_cidr"
    fail_msg: >-
      Set the slskd Soulseek and web credentials in group_vars/slskd/vault.yml.
      slskd_api_key must be empty or 16 to 255 characters without semicolons,
      and slskd_api_key_role must be ReadOnly, ReadWrite or Administrator.
    quiet: true
  tags:
    - preflight

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/config"
    - "{{ config_base }}/config/auth"
    - "{{ sabnzbd_base }}"

# The client images chown their own configuration directories to their
# runtime user, so these are only created, not re-owned.
- name: Create download client configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ qbittorrent_config_path }}"
    - "{{ sabnzbd_base }}/config"
    - "{{ slskd_config_path }}"

- name: Create SABnzbd incomplete download directory
  ansible.builtin.file:
    path: "{{ sabnzbd_incomplete_path }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: '0755'

- name: Create slskd download directories in downloads volume
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - downloads:/downloads
      - alpine:3.20
      - sh
      - -c
      - mkdir -p /downloads/music /downloads/music/.incomplete
  changed_when: false

# Each service's label carries the checksums of its env and mounted files, so
# a change recreates only that service (and, for gluetun, its dependents)
# instead of interrupting every client.
- name: Deploy gluetun environment file
  ansible.builtin.template:
    src: env/gluetun.env.j2
    dest: "{{ config_base }}/env/gluetun.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gluetun_deploy_environment_file

- name: Deploy control server roles
  ansible.builtin.template:
    src: config/auth.toml.j2
    dest: "{{ config_base }}/config/auth/config.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gluetun_deploy_control_server_roles

- name: Deploy qBittorrent port sync script
  ansible.builtin.copy:
    src: port-sync.sh
    dest: "{{ config_base }}/port-sync.sh"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: gluetun_deploy_port_sync_script

- name: Deploy qBittorrent port sync environment file
  ansible.builtin.template:
    src: env/port-sync.env.j2
    dest: "{{ config_base }}/env/port-sync.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gluetun_deploy_port_sync_environment_file

- name: Seed initial SABnzbd configuration
  ansible.builtin.template:
    src: config/sabnzbd.ini.j2
    dest: "{{ sabnzbd_base }}/config/sabnzbd.ini"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: '0600'
    force: false

- name: Deploy slskd configuration file
  ansible.builtin.template:
    src: config/slskd.yml.j2
    dest: "{{ slskd_config_path }}/slskd.yml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: gluetun_deploy_slskd_configuration_file

- name: Deploy slskd environment file
  ansible.builtin.template:
    src: env/slskd.env.j2
    dest: "{{ config_base }}/env/slskd.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gluetun_deploy_slskd_environment_file

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

# Migration: the clients ran as standalone stacks whose containers have the
# same names. Remove those projects; their data directories are reused.
- name: Find retired standalone client stacks
  ansible.builtin.stat:
    path: "{{ docker_base_path }}/{{ item }}/compose.yaml"
  loop: "{{ gluetun_retired_client_stacks }}"
  register: gluetun_retired_client_stack_files

- name: Remove retired standalone client stacks
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ docker_base_path }}/{{ item.item }}"
      - down
  loop: "{{ gluetun_retired_client_stack_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  changed_when: true

- name: Remove retired standalone client stack files
  ansible.builtin.file:
    path: "{{ docker_base_path }}/{{ item }}"
    state: absent
  loop:
    - qbittorrent/compose.yaml
    - qbittorrent/port-sync.sh
    - qbittorrent/env
    - sabnzbd/compose.yaml
    - slskd/compose.yaml
    - slskd/env

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    # Check mode skips the wait: a dry run would judge the existing containers.
    wait: "{{ not ansible_check_mode }}"
    wait_timeout: 300
  register: compose_result
