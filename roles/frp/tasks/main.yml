---
- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/config"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy frp config file
  ansible.builtin.template:
    src: frps.toml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/config/frps.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: frp_deploy_frp_config_file

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (frp_deploy_frp_config_file.changed | default(false))
         else 'auto' }}
  register: compose_result
