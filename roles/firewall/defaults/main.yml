---
# Firewall (UFW) settings
firewall_enabled: true

# Port groups - enable/disable based on what's deployed on this host
firewall_group_base: true
firewall_group_media_servers: true
firewall_group_media_acquisition_products: true
firewall_group_media_consumption: true
firewall_group_product_stacks: true
firewall_group_development: true
firewall_group_infrastructure: true
firewall_group_downloads: true
firewall_group_social: true
firewall_group_matrix: true
firewall_group_kibble: true
# Komodo Periphery agent port; only hosts running roles/infra_periphery
# (standalone agent, not the core host) enable this in inventory.
firewall_group_komodo_periphery: false
# Emulator streaming containers (roles/pcsx2, roles/dolphin); max only.
firewall_group_emulator_streaming: false

# Explicitly remove retired rules; deleting an entry from the allow-list does
# not remove a UFW rule that was created by an earlier playbook run.
firewall_ports_revoked:
  - { port: 5180, proto: tcp, comment: "Retired Album Sort host port" }

# Base ports (SSH, HTTP, HTTPS)
firewall_ports_base:
  - { port: "{{ ansible_port | default(22) }}", proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
  - { port: 19999, proto: tcp, comment: "Netdata dashboard" }

# Media servers
firewall_ports_media_servers:
  - { port: 32400, proto: tcp, comment: "Plex" }
  - { port: 8000, proto: tcp, comment: "Tunarr" }

# Media acquisition products
firewall_ports_media_acquisition_products:
  - { port: 8989, proto: tcp, comment: "Sonarr" }
  - { port: 7878, proto: tcp, comment: "Radarr" }
  - { port: 8686, proto: tcp, comment: "Lidarr" }
  - { port: 9696, proto: tcp, comment: "Prowlarr" }
  - { port: 5055, proto: tcp, comment: "Jellyseerr" }
  - { port: 8945, proto: tcp, comment: "Pinchflat" }
  - { port: 9705, proto: tcp, comment: "Huntarr" }

# Media consumption
firewall_ports_media_consumption:
  - { port: 8888, proto: tcp, comment: "RomM" }
  - { port: 9078, proto: tcp, comment: "Multi-Scrobbler" }
  - { port: 9999, proto: tcp, comment: "Stash" }

# Product stacks
firewall_ports_product_stacks:
  - { port: 2283, proto: tcp, comment: "Immich" }
  - { port: 8787, proto: tcp, comment: "Papra" }
  - { port: 3100, proto: tcp, comment: "Homebox" }
  - { port: 3030, proto: tcp, comment: "Dawarich" }
  - { port: 8280, proto: tcp, comment: "Miniflux" }
  - { port: 2000, proto: tcp, comment: "Reactflux" }
  - { port: 8181, proto: tcp, comment: "FiveFilters" }
  - { port: 3232, proto: tcp, comment: "Karakeep" }
  - { port: 5353, proto: tcp, comment: "Kavita" }

# Development
firewall_ports_development:
  - { port: 2222, proto: tcp, comment: "GitLab SSH" }
  - { port: 5678, proto: tcp, comment: "n8n" }
  - { port: 8080, proto: tcp, comment: "Open WebUI" }
  - { port: 8411, proto: tcp, comment: "Paseo relay" }

# Social
firewall_ports_social:
  - { port: 3002, proto: tcp, comment: "Mastodon" }
  - { port: 4000, proto: tcp, comment: "Mastodon Streaming" }

# Matrix (LiveKit)
firewall_ports_matrix:
  - { port: 7881, proto: tcp, comment: "LiveKit RTC TCP" }
  - { port: "50100:50200", proto: udp, comment: "LiveKit media relay" }

# Infrastructure
#
# Port entries support an optional `src` field that scopes the rule to a
# specific source CIDR.  Used for kibble: the only consumer is Traefik
# (in a Docker bridge) so there's no reason to expose 18080 to the LAN —
# `src: 172.16.0.0/12` covers every Docker bridge subnet on the host
# while keeping the port closed to anything outside the docker namespace.
firewall_ports_infrastructure:
  - { port: 9120, proto: tcp, comment: "Komodo" }
  - { port: 1411, proto: tcp, comment: "PocketID" }
  - { port: 18080, proto: tcp, src: "172.16.0.0/12", comment: "kibble API (Docker bridges only)" }

# Komodo Periphery (inbound from Core on nuc-mini only)
firewall_ports_komodo_periphery:
  - port: 8120
    proto: tcp
    src: "{{ hostvars['nuc-mini'].ansible_host }}/32"
    comment: "Komodo Periphery (core host only)"

# Emulator streaming (roles/pcsx2, roles/dolphin on max)
# The broker APIs are the sensitive half: an unauthenticated caller that
# reaches them can launch and stop games, so they are pinned to the one
# host that has any business calling them. The plain-HTTP Selkies ports
# are Traefik's backends and get the same treatment. Only the containers'
# own HTTPS listeners are open to the LAN, for direct access that skips
# Traefik entirely.
firewall_ports_emulator_streaming:
  - port: 3010
    proto: tcp
    src: "{{ hostvars['nuc-mini'].ansible_host }}/32"
    comment: "PCSX2 Selkies HTTP (Traefik backend)"
  - port: 3011
    proto: tcp
    comment: "PCSX2 Selkies HTTPS (direct LAN)"
  - port: 8010
    proto: tcp
    src: "{{ hostvars['nuc-mini'].ansible_host }}/32"
    comment: "PCSX2 RomM broker API"
  - port: 3020
    proto: tcp
    src: "{{ hostvars['nuc-mini'].ansible_host }}/32"
    comment: "Dolphin Selkies HTTP (Traefik backend)"
  - port: 3021
    proto: tcp
    comment: "Dolphin Selkies HTTPS (direct LAN)"
  - port: 8020
    proto: tcp
    src: "{{ hostvars['nuc-mini'].ansible_host }}/32"
    comment: "Dolphin RomM broker API"

# Downloads (BitTorrent)
firewall_ports_downloads:
  - { port: 6881, proto: tcp, comment: "BitTorrent" }
  - { port: 6881, proto: udp, comment: "BitTorrent UDP" }

# kibble video plane + ONVIF.  These are the LAN-facing surfaces:
#  * 8554/tcp — RTSP server (Protect pulls live streams via this; the
#    main API at 18080 stays scoped to Docker bridges per the
#    infrastructure rule above)
#  * 8555/tcp + 8555/udp — WebRTC media (browser playback)
#  * 3702/udp — WS-Discovery multicast for ONVIF (Protect's auto-
#    adoption probes)
#  * 80/tcp on the per-feeder ONVIF VIPs is already covered by the
#    base "HTTP" rule
firewall_ports_kibble:
  - { port: 8554, proto: tcp, comment: "kibble RTSP" }
  - { port: 8555, proto: tcp, comment: "kibble WebRTC TCP" }
  - { port: 8555, proto: udp, comment: "kibble WebRTC UDP" }
  - { port: 3702, proto: udp, comment: "kibble WS-Discovery (ONVIF)" }

# kibble P2P video (the last-mile fix).  The LAN-direct TUTK handshake
# has the FEEDER connect back to kibble's video client on an EPHEMERAL
# UDP port — random per session — after the cloud PUNCH_TO2.  A fixed-port
# allow can't cover that, so instead allow all UDP *from* each feeder's LAN
# IP; the KNOCK/session packets originate there.  Without this, ufw's DROP
# policy silently eats the feeder's KNOCK and every video Dial times out
# (registration still works because 10001/10240 are open, so the symptom is
# "camera unavailable" while the feeder looks online).
#
# Keep this list in sync with roles/kibble `kibble_feeder_ips` (plus
# any extra feeders).  DHCP-reserve the feeders so these stay valid; if you
# would rather not track IPs, replace with the LAN CIDR (192.168.1.0/24).
firewall_kibble_p2p_srcs:
  - 192.168.1.180   # left_feeder (JNGT)
  - 192.168.1.181   # right_feeder (HFEY)
  - 192.168.1.182   # B8NGCEB9 (added 2025)

# Consolidated port list - dynamically built from enabled groups
firewall_ports_all: >-
  {{
    (firewall_ports_base if firewall_group_base else []) +
    (firewall_ports_media_servers if firewall_group_media_servers else []) +
    (firewall_ports_media_acquisition_products if firewall_group_media_acquisition_products else []) +
    (firewall_ports_media_consumption if firewall_group_media_consumption else []) +
    (firewall_ports_product_stacks if firewall_group_product_stacks else []) +
    (firewall_ports_development if firewall_group_development else []) +
    (firewall_ports_infrastructure if firewall_group_infrastructure else []) +
    (firewall_ports_downloads if firewall_group_downloads else []) +
    (firewall_ports_social if firewall_group_social else []) +
    (firewall_ports_matrix if firewall_group_matrix else []) +
    (firewall_ports_kibble if firewall_group_kibble else []) +
    (firewall_ports_komodo_periphery if firewall_group_komodo_periphery else []) +
    (firewall_ports_emulator_streaming if firewall_group_emulator_streaming else [])
  }}
