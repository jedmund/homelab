---
# Social Stack - Mastodon
# Uses docker_compose_v2 for container orchestration

- name: Validate Mastodon encryption keys before changing deployment files
  ansible.builtin.assert:
    that:
      - mastodon_active_record_encryption_deterministic_key | default('') | length > 0
      - mastodon_active_record_encryption_key_derivation_salt | default('') | length > 0
      - mastodon_active_record_encryption_primary_key | default('') | length > 0
    fail_msg: Store the existing Mastodon Active Record encryption keys in group_vars/social/vault.yml.
  no_log: true

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/env"

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy environment files
  template:
    src: "env/{{ item }}.env.j2"
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/{{ item }}.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - mastodon
    - mastodon-db
  no_log: true
  register: social_deploy_environment_files

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (social_deploy_environment_files.changed | default(false))
         else 'auto' }}
    wait: true
    wait_timeout: 180
  register: compose_result
