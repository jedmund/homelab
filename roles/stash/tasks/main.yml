---
# Stash product stack

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/env"
    - "{{ docker_base_path }}/{{ stack_name }}/config"
    - "{{ docker_base_path }}/{{ stack_name }}/config/metadata"
    - "{{ docker_base_path }}/{{ stack_name }}/config/cache"
    - "{{ docker_base_path }}/{{ stack_name }}/config/blobs"
    - "{{ docker_base_path }}/{{ stack_name }}/config/generated"

- name: Deploy environment file
  ansible.builtin.template:
    src: env/stash.env.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/stash.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  register: stash_deploy_environment_file

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

# Seed an empty config on first deploy, then patch it before starting Stash.
# Existing application-managed settings are preserved. Stash sits behind the
# TinyAuth authwall, so its own
# auth is redundant: we allow public-without-auth, reset the tripwire if it
# fired, and clear stored credentials. A restart makes Stash reload config.yml.
- name: Seed Stash config before its first start
  ansible.builtin.copy:
    content: "---\n"
    dest: "{{ config_base }}/config/config.yml"
    owner: "{{ ansible_user }}"
    mode: '0600'
    force: false

- name: Check for an existing Stash config.yml
  ansible.builtin.stat:
    path: "{{ config_base }}/config/config.yml"
  register: _stash_config

- name: Allow Stash to serve behind the reverse-proxy authwall
  ansible.builtin.lineinfile:
    path: "{{ config_base }}/config/config.yml"
    regexp: '^dangerous_allow_public_without_auth:'
    line: 'dangerous_allow_public_without_auth: true'
    create: false
  when:
    - stash_public_without_auth
    - _stash_config.stat.exists
  register: stash_allow_stash_to_serve_behind_the_reverse_proxy_authwall

- name: Reset the tripped public-internet security tripwire
  ansible.builtin.lineinfile:
    path: "{{ config_base }}/config/config.yml"
    regexp: '^security_tripwire_accessed_from_public_internet:'
    state: absent
  when:
    - stash_public_without_auth
    - _stash_config.stat.exists
  register: stash_reset_the_tripped_public_internet_security_tripwire

- name: Disable Stash built-in authentication (credentials handled by the authwall)
  ansible.builtin.lineinfile:
    path: "{{ config_base }}/config/config.yml"
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^username:'
    - '^password:'
  when:
    - stash_public_without_auth
    - _stash_config.stat.exists
  register: stash_disable_stash_built_in_authentication_credentials_handled_by_the_authwall

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (stash_deploy_environment_file.changed | default(false)) or
         (stash_allow_stash_to_serve_behind_the_reverse_proxy_authwall.changed | default(false)) or
         (stash_reset_the_tripped_public_internet_security_tripwire.changed | default(false)) or
         (stash_disable_stash_built_in_authentication_credentials_handled_by_the_authwall.changed | default(false))
         else 'auto' }}
  register: compose_result
