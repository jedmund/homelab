---
# Backup Stack - Borgmatic running locally on nuc-mini.
# Repo at {{ borg_repo_host_path }} on {{ backup_repo_mount_path }}; NFS-mounted UniFi Drive share at
# {{ nas_mount_host_path }} receives rsync of new segment files after each run.

- name: Install NFS client packages
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
    update_cache: true
  become: true

- name: Create stack and repo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/build"
    - "{{ docker_base_path }}/{{ stack_name }}/config"
    - "{{ docker_base_path }}/{{ stack_name }}/config/borgmatic"
    - "{{ docker_base_path }}/{{ stack_name }}/env"
    - "{{ docker_base_path }}/{{ stack_name }}/restore-tests"
    - "{{ docker_base_path }}/{{ stack_name }}/scripts"

- name: Mount the Borg repo filesystem
  ansible.posix.mount:
    path: "{{ backup_repo_mount_path }}"
    src: "{{ backup_repo_mount_src }}"
    fstype: "{{ backup_repo_mount_fstype }}"
    opts: defaults,nofail
    state: mounted
  become: true

- name: Refuse to place the Borg repo on an unmounted filesystem
  ansible.builtin.command: mountpoint -q {{ backup_repo_mount_path }}
  changed_when: false

- name: Create Borg repo parent directory
  ansible.builtin.file:
    path: "{{ borg_repo_host_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0700'
  become: true

- name: Create DB dumps directory
  ansible.builtin.file:
    path: "{{ borg_dumps_host_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0700'
  become: true

- name: Ensure NAS mount point exists
  ansible.builtin.file:
    path: "{{ nas_mount_host_path }}"
    state: directory
    # Once mounted, this is the NAS export root. Its ownership and mode belong
    # to the NAS and may be protected by root-squash, so manage only existence.
  become: true

- name: Deploy systemd mount unit
  ansible.builtin.template:
    src: "systemd/{{ nas_systemd_unit_basename }}.mount.j2"
    dest: "/etc/systemd/system/{{ nas_systemd_unit_basename }}.mount"
    owner: root
    group: root
    mode: '0644'
  become: true
  register: backup_nas_mount
  notify:
    - Reload systemd
    - Restart NAS automount

- name: Deploy systemd automount unit
  ansible.builtin.template:
    src: "systemd/{{ nas_systemd_unit_basename }}.automount.j2"
    dest: "/etc/systemd/system/{{ nas_systemd_unit_basename }}.automount"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Restart NAS automount

- name: Inspect NAS automount state
  ansible.builtin.systemd_service:
    name: "{{ nas_systemd_unit_basename }}.automount"
    daemon_reload: true
  register: nas_automount_service
  changed_when: false
  become: true

- name: Stop direct NAS mount before activating automount
  ansible.builtin.systemd_service:
    name: "{{ nas_systemd_unit_basename }}.mount"
    state: stopped
  when: nas_automount_service.status.ActiveState != 'active'
  become: true

- name: Enable and start NAS automount
  ansible.builtin.systemd_service:
    name: "{{ nas_systemd_unit_basename }}.automount"
    enabled: true
    state: started
  become: true

- name: Apply NAS mount unit changes before container deployment
  ansible.builtin.meta: flush_handlers

- name: Configure Minecraft snapshot transfer
  ansible.builtin.include_tasks: minecraft.yml
  when: backup_minecraft_enabled

- name: Deploy build Dockerfile
  ansible.builtin.template:
    src: Dockerfile.borgmatic.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/build/Dockerfile"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: backup_dockerfile

- name: Deploy borgmatic config
  ansible.builtin.template:
    src: borgmatic.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/config/borgmatic/config.yaml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: backup_deploy_borgmatic_config

- name: Deploy environment file
  ansible.builtin.template:
    src: env/borgmatic.env.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/borgmatic.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: backup_deploy_environment_file

- name: Deploy post-backup rsync script
  ansible.builtin.template:
    src: scripts/post-backup-rsync.sh.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/scripts/post-backup-rsync.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'
  register: backup_deploy_post_backup_rsync_script

- name: Deploy CouchDB dump script
  ansible.builtin.template:
    src: scripts/dump-couchdb.sh.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/scripts/dump-couchdb.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'
  register: backup_deploy_couchdb_dump_script

- name: Deploy SQLite dump script
  ansible.builtin.template:
    src: scripts/dump-sqlite.sh.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/scripts/dump-sqlite.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'
  register: backup_deploy_sqlite_dump_script

- name: Deploy backup status verification script
  ansible.builtin.template:
    src: scripts/verify-backup-status.sh.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/scripts/verify-backup-status.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy Prowlarr restore verification script
  ansible.builtin.template:
    src: scripts/verify-prowlarr-restore.sh.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/scripts/verify-prowlarr-restore.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Inspect backup build requirements
  ansible.builtin.import_tasks: build.yml

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    # Explicitly override service build policies to avoid no-op rebuilds.
    build: "{{ 'always' if (backup_build_required | default(true)) else 'never' }}"
    pull: policy
    remove_orphans: true
    recreate: >-
      {{ 'always' if
         (backup_deploy_borgmatic_config.changed | default(false)) or
         (backup_deploy_environment_file.changed | default(false)) or
         (backup_deploy_post_backup_rsync_script.changed | default(false)) or
         (backup_deploy_couchdb_dump_script.changed | default(false)) or
         (backup_deploy_sqlite_dump_script.changed | default(false)) or
         (backup_minecraft_script.changed | default(false))
         else 'auto' }}
  register: compose_result

- name: Record successful backup build inputs
  ansible.builtin.copy:
    content: "{{ {'fingerprint': backup_build_fingerprint} | to_json }}\n"
    dest: "{{ docker_base_path }}/{{ stack_name }}/.ansible-build-inputs.json"
    owner: "{{ ansible_user }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - backup_build_services | default([]) | length > 0
