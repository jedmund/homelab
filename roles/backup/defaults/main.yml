---
# Stack identity
stack_name: backup
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Borgmatic image (extended via Dockerfile to add rsync + nfs-common)
borgmatic_upstream_image: ghcr.io/borgmatic-collective/borgmatic:latest

# Borg repo (host-local on nuc-mini, mounted into container at /repo)
borg_repo_host_path: /var/backup/borg
borg_repo_container_path: /repo
borg_repo_label: nuc-mini

# Retention
borg_keep_daily: 30

# Archive naming. Borgmatic defaults archive_name_format to "{hostname}-{now}"
# and derives match_archives from it, so prune only ever considers archives
# whose prefix matches the current hostname. The borgmatic container's
# hostname is its container ID, which changes on every recreate, so each
# rebuild orphaned the previous archives: they stopped matching, prune never
# touched them, and the repo only grew. Pin both to the stable repo label
# (the compose file pins the container hostname to match).
borg_archive_name_format: "{{ borg_repo_label }}-{now:%Y-%m-%dT%H:%M:%S.%f}"
borg_match_archives: "sh:{{ borg_repo_label }}-*"

# Schedule (container internal cron, container TZ matches host)
borg_backup_cron: "0 2 * * *"
borg_run_on_startup: "false"

# Encryption
borg_encryption_mode: repokey-blake2
# borg_passphrase - defined in vault

# Compression
borg_compression: zstd,3

# Source paths to back up (read-only mounted into container at same path)
borg_source_paths:
  - /opt/docker
  # Dokploy VM qcow2 dumps produced nightly by /usr/local/sbin/dokploy-vm-backup
  # (dokploy_host role). The VM is shut down before each dump so the
  # image is application-consistent on first boot from a restore.
  - /var/backup/dokploy

# Named docker volumes that aren't under /opt/docker (i.e. stacks using
# internal compose volumes rather than bind mounts). Mounted read-only
# into the borgmatic container at `path` and added to source_directories
# so their contents are captured. SQLite files inside these volumes also
# need an entry in dump-sqlite.sh.j2 for a consistent snapshot.
#
# Volume names follow docker compose's project_volume convention; check
# `docker volume ls` on the host if in doubt.
borg_named_volumes:
  - volume: karakeep-data
    path: /karakeep-data
  # Garage object blocks live directly on the NAS so the NUC-local Borg repo
  # does not duplicate an unbounded media library. The metadata volume remains
  # local and its periodic consistent snapshots are still backed up here.
  - volume: kizuna_kizuna-garage-meta
    path: /kizuna-garage-meta

# Patterns to exclude (relative to source paths)
# musicbrainz: reproducible from upstream MetaBrainz dumps per its README
# backup itself: avoid recursive snapshot of the borgmatic config dir
# gitlab: live DB/cache files are unsafe to copy mid-write; the dump
#   produced by the gitlab-backup cron (gitlab role) under
#   data/backups is the consistent restore artifact for those subsystems.
#   The rest of /opt/docker/gitlab (config, git-data, uploads,
#   registry blobs) is safe to copy live and stays in the archive.
borg_exclude_patterns:
  - /opt/docker/musicbrainz
  - /opt/docker/backup
  - /opt/docker/gitlab/data/postgresql
  - /opt/docker/gitlab/data/redis
  - /opt/docker/gitlab/data/prometheus
  - /opt/docker/gitlab/logs

# Integrity checks
borg_check_repository_frequency: 1 week
borg_check_archives_frequency: 1 month

# Custom DB dumps (CouchDB + SQLite). Native Postgres/MariaDB/MongoDB dumps
# are streamed by borgmatic directly; these are written to disk first by
# scripts in before_backup hooks, then backed up by borgmatic as part of
# the source path below.
borg_dumps_host_path: /var/backup/dumps
borg_dumps_container_path: /dumps

# borg-ui (web frontend)
borg_ui_image: ainullcode/borg-ui:latest
borg_ui_domain: backup.atelier.house
borg_ui_container_port: 8081
# OIDC against PocketID is configured manually via the borg-ui Settings
# panel after first deploy (the image doesn't accept OIDC config via env
# vars). See README for the bootstrap procedure.

# Networks the borgmatic container needs to join so it can reach every DB
# by container hostname. All declared external because they're created by
# other stacks.
borg_networks:
  - backend-internal   # mastodon, synapse, mas, komodo, n8n, kaneo, miniflux, romm
  - shared-network     # immich postgres
  - proxy-network      # couchdb (obsidian_livesync)

# DB credentials. Passwords (and a few non-secret values like
# komodo_db_username, obsidian_livesync_couchdb_user) come from each
# stack's vault, which loads for every group nuc-mini is a member of:
#   immich_db_password
#   mastodon_db_password
#   synapse_db_password
#   mas_db_password
#   n8n_db_password
#   miniflux_db_password
#   dawarich_db_password
#   vault_kaneo_db_password
#   vault_kizuna_postgres_password
#   vault_hugginghack_postgres_password
#   komodo_db_username, komodo_db_password
#   romm_db_root_password
#   obsidian_livesync_couchdb_user, obsidian_livesync_couchdb_password
#
# Non-secret DB names and usernames are defined in each stack's role
# defaults (e.g. roles/immich/defaults/main.yml). Role
# defaults only load when their own role is applied, so the backup
# playbook can't see them. The block below mirrors those values so the
# borgmatic config template can resolve them. Update both places when a
# DB name or user changes; the per-stack role default is the source of
# truth, this is a mirror for backup's scope.
immich_db_name: immich
immich_db_username: postgres
mastodon_db_name: mastodon_production
mastodon_db_user: mastodon
synapse_db_name: synapse
synapse_db_user: synapse
mas_db_name: mas
mas_db_user: mas
n8n_db_name: n8n
n8n_db_user: n8n
miniflux_db_name: miniflux
miniflux_db_user: miniflux
dawarich_db_name: dawarich_production
dawarich_db_username: dawarich
kaneo_db_name: kaneo
kaneo_db_user: kaneo
kaneo_db_password: "{{ vault_kaneo_db_password }}"
kizuna_db_name: kizuna_api_production
kizuna_db_user: kizuna
kizuna_db_password: "{{ vault_kizuna_postgres_password }}"
hugginghack_db_name: hugginghack
hugginghack_db_user: hugginghack
hugginghack_db_password: "{{ vault_hugginghack_postgres_password }}"
obsidian_livesync_couchdb_port: 5984

# Monitoring (Healthchecks.io). Create a check with a 1-day-and-some grace
# period at https://healthchecks.io and put its ping URL in the vault.
# borg_healthchecks_url - defined in vault
borg_healthchecks_send_logs: true
borg_healthchecks_verify_tls: true
borg_healthchecks_states:
  - finish
  - fail

# NAS mount (rsync target)
nas_mount_host_path: /mnt/nas/backup
nas_mount_container_path: /nas
# Systemd unit basename derived from path: /mnt/nas/backup -> mnt-nas-backup
nas_systemd_unit_basename: mnt-nas-backup
nas_share_subpath: borg-nuc-mini   # subdirectory inside the share for this host's repo
nas_nfs_server: 192.168.1.3        # UniFi NAS
# UniFi Drive exports each Shared Drive at /volume/<storage-uuid>/.srv/.unifi-drive/<name>/.data.
# UUID is per-NAS-instance; rediscover with `showmount -e 192.168.1.3` if the NAS is ever rebuilt.
nas_nfs_export: /volume/3184c922-dd97-43b0-b873-8bcb99ac2668/.srv/.unifi-drive/Homelab/.data
nas_nfs_options: "rw,soft,timeo=30,retrans=2,noatime,_netdev,nofail"
