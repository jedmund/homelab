---
# MusicBrainz mirror - clones metabrainz/musicbrainz-docker upstream and
# layers a local/ overlay (Traefik labels, network attachment) on top.
# Initial DB import is a manual one-shot; see roles/musicbrainz/README.md.

- name: Validate MusicBrainz secret inputs
  ansible.builtin.assert:
    that:
      - musicbrainz_replication_token | default('') | length > 0
      - musicbrainz_healthchecks_url | default('') | length > 0
    fail_msg: >-
      musicbrainz_replication_token and musicbrainz_healthchecks_url must be
      defined in group_vars/musicbrainz/vault.yml
  no_log: true

# Updating the checkout before inspecting an existing database can put
# schema-31 server and PostgreSQL definitions in front of schema-30 storage.
# Refuse that transition in the routine role. A new installation has neither
# the named volume nor a container and follows the documented first-run path.
- name: Inspect existing MusicBrainz database volume
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - musicbrainz_pgdata
  register: musicbrainz_database_volume
  changed_when: false
  failed_when: musicbrainz_database_volume.rc not in [0, 1]
  check_mode: false

- name: Inspect existing MusicBrainz database container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - musicbrainz-db-1
  register: musicbrainz_database_container
  changed_when: false
  failed_when: musicbrainz_database_container.rc not in [0, 1]
  check_mode: false

- name: Require an inspectable database when persistent data exists
  ansible.builtin.assert:
    that:
      - >-
        musicbrainz_database_volume.rc != 0 or
        (musicbrainz_database_container.rc == 0 and
         (musicbrainz_database_container.stdout | from_json | first).State.Running)
    fail_msg: >-
      musicbrainz_pgdata exists but musicbrainz-db-1 is not running. Start and
      inspect the existing database before deploying; the role will not infer
      its schema from a persistent volume.

- name: Read existing MusicBrainz database schema sequence
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - musicbrainz-db-1
      - psql
      - -U
      - musicbrainz
      - -d
      - musicbrainz_db
      - -tAc
      - SELECT current_schema_sequence FROM replication_control;
  register: musicbrainz_database_schema
  changed_when: false
  check_mode: false
  when: musicbrainz_database_volume.rc == 0

- name: Require the database schema expected by the pinned release
  ansible.builtin.assert:
    that:
      - musicbrainz_database_schema.stdout | trim | int == musicbrainz_expected_schema_sequence
    fail_msg: >-
      The existing MusicBrainz database is schema
      {{ musicbrainz_database_schema.stdout | default('unknown') | trim }}, but
      {{ musicbrainz_upstream_version }} requires schema
      {{ musicbrainz_expected_schema_sequence }}. Follow the schema-31 upgrade
      procedure in roles/musicbrainz/README.md before applying this role.
  when: musicbrainz_database_volume.rc == 0

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"

- name: Clone/update musicbrainz-docker upstream
  ansible.builtin.git:
    repo: "{{ musicbrainz_upstream_repo }}"
    dest: "{{ musicbrainz_upstream_path }}"
    version: "{{ musicbrainz_upstream_version }}"
    update: true
    accept_hostkey: true
  become: false
  register: musicbrainz_git

- name: Create local overlay directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ musicbrainz_upstream_path }}/local"
    - "{{ musicbrainz_upstream_path }}/local/compose"
    - "{{ musicbrainz_upstream_path }}/local/secrets"

- name: Deploy upstream .env
  template:
    src: env.j2
    dest: "{{ musicbrainz_upstream_path }}/.env"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: musicbrainz_deploy_upstream_env

- name: Deploy atelier compose overlay
  template:
    src: local/compose/atelier.yml.j2
    dest: "{{ musicbrainz_upstream_path }}/local/compose/atelier.yml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: musicbrainz_deploy_atelier_compose_overlay

- name: Deploy replication health-check wrapper
  ansible.builtin.template:
    src: local/replication-check.sh.j2
    dest: "{{ musicbrainz_upstream_path }}/local/replication-check.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'
  register: musicbrainz_deploy_replication_check

- name: Deploy replication crontab
  ansible.builtin.template:
    src: local/replication.cron.j2
    dest: "{{ musicbrainz_upstream_path }}/local/replication.cron"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: musicbrainz_deploy_replication_cron

- name: Deploy replication Healthchecks URL
  ansible.builtin.template:
    src: local/secrets/musicbrainz_healthchecks_url.j2
    dest: "{{ musicbrainz_upstream_path }}/local/secrets/musicbrainz_healthchecks_url"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: musicbrainz_deploy_healthchecks_url

- name: Deploy MetaBrainz replication access token
  template:
    src: local/secrets/metabrainz_access_token.j2
    dest: "{{ musicbrainz_upstream_path }}/local/secrets/metabrainz_access_token"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: musicbrainz_deploy_metabrainz_replication_access_token

- name: Remove superseded schema-upgrade helper
  ansible.builtin.file:
    path: "{{ config_base }}/schema-upgrade.sh"
    state: absent

# Render the multi-file overlay chain into a single self-contained compose
# file so Komodo only sees one definition per service. `-f` flags here
# override `COMPOSE_FILE` from .env (which points at the merged file we
# are about to write), so this still works on the very first run.
- name: Render merged compose file
  ansible.builtin.command:
    cmd: >-
      docker compose
      {% for f in musicbrainz_source_compose_files %} -f {{ f }}{% endfor %}
      config
    chdir: "{{ musicbrainz_upstream_path }}"
  register: musicbrainz_merged_compose
  changed_when: false
  check_mode: false

- name: Reset MusicBrainz service pull policies
  ansible.builtin.set_fact:
    musicbrainz_compose_services: {}

- name: Preserve registry pulls without pulling local build tags
  ansible.builtin.set_fact:
    musicbrainz_compose_services: >-
      {{ musicbrainz_compose_services | combine({item.key: item.value | combine({
        'pull_policy': 'build' if item.value.build is defined
          else (docker_pull_policy | default('missing'))
      })}) }}
  loop: "{{ (musicbrainz_merged_compose.stdout | from_yaml).services | dict2items }}"
  no_log: true

- name: Write merged compose file
  ansible.builtin.copy:
    content: >-
      {{ (musicbrainz_merged_compose.stdout | from_yaml)
         | combine({'services': musicbrainz_compose_services}) | to_nice_yaml(indent=2) }}
    dest: "{{ musicbrainz_upstream_path }}/{{ musicbrainz_merged_compose_path }}"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Inspect musicbrainz build requirements
  ansible.builtin.import_tasks: build.yml

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ musicbrainz_upstream_path }}"
    state: present
    # Explicitly override service build policies to avoid no-op rebuilds.
    build: "{{ 'always' if (musicbrainz_build_required | default(true)) else 'never' }}"
    pull: policy
    remove_orphans: true
    recreate: >-
      {{ 'always' if
         (musicbrainz_deploy_upstream_env.changed | default(false)) or
         (musicbrainz_deploy_atelier_compose_overlay.changed | default(false)) or
         (musicbrainz_deploy_replication_check.changed | default(false)) or
         (musicbrainz_deploy_replication_cron.changed | default(false)) or
         (musicbrainz_deploy_healthchecks_url.changed | default(false)) or
         (musicbrainz_deploy_metabrainz_replication_access_token.changed | default(false))
         else 'auto' }}
  register: compose_result

- name: Record successful musicbrainz build inputs
  ansible.builtin.copy:
    content: "{{ {'fingerprint': musicbrainz_build_fingerprint} | to_json }}\n"
    dest: "{{ musicbrainz_upstream_path }}/.ansible-build-inputs.json"
    owner: "{{ ansible_user }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - musicbrainz_build_services | default([]) | length > 0
