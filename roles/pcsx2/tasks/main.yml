---
# PCSX2 emulator streaming stack

# Both preflight checks fail on host state that a deploy cannot fix, and
# both produce a container that starts and then dies rather than an
# obvious error, so they are worth catching here.

- name: Verify the NVIDIA driver is usable
  ansible.builtin.command: nvidia-smi -L
  register: pcsx2_nvidia_smi
  changed_when: false
  # Read-only, so run it even under --check: a dry run is exactly when you
  # want to find out the driver is unusable.
  check_mode: false
  failed_when: pcsx2_nvidia_smi.rc != 0
  # A driver upgraded in place without a reboot leaves userspace and the
  # loaded kernel module on different versions. Containers started before
  # the upgrade keep running on the old module, so the box looks healthy
  # right up until something new asks for a GPU.

- name: Check NVIDIA DRM modeset state
  ansible.builtin.slurp:
    src: /sys/module/nvidia_drm/parameters/modeset
  register: pcsx2_drm_modeset
  failed_when: false
  changed_when: false

- name: Require DRM modeset before starting Selkies
  ansible.builtin.assert:
    that: (pcsx2_drm_modeset.content | default('') | b64decode | trim) == 'Y'
    fail_msg: >-
      nvidia_drm modeset is off on {{ inventory_hostname }}, so Selkies
      cannot get a GL context and PCSX2 will die on startup. Run the
      gpu_tools role to install /etc/modprobe.d/nvidia-drm.conf, then
      reboot. See roles/romm/README.md.

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/config"

# PCSX2 writes .mec and .nvm files next to the BIOS dump on first boot,
# so this directory has to be writable by the container's user rather
# than by ansible_user like the rest of the tree. The image's own init
# chowns /config but does not recurse into subdirectories, so a bios
# folder created here would otherwise stay root-owned and PCSX2 fails
# with "Failed to write MEC file. Check your BIOS/permission settings."
#
# recurse covers BIOS dumps copied in by hand, which land owned by
# whoever scp'd them.
- name: Create the BIOS directory writable by the container
  ansible.builtin.file:
    path: "{{ config_base }}/config/bios"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: '0755'

# Separate from the task above because `recurse` applies `mode` to files
# as well as directories, which would leave the BIOS dump executable.
- name: Hand BIOS dumps to the container's user
  ansible.builtin.file:
    path: "{{ config_base }}/config/bios"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    recurse: true

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment file
  ansible.builtin.template:
    src: env/pcsx2.env.j2
    dest: "{{ config_base }}/env/pcsx2.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Check for PS2 BIOS files
  ansible.builtin.find:
    paths: "{{ config_base }}/config/bios"
    patterns: '*.bin,*.BIN,*.rom*,*.ROM*'
  register: pcsx2_bios_files

- name: Warn when no PS2 BIOS is present
  ansible.builtin.debug:
    msg: >-
      No BIOS files found in {{ config_base }}/config/bios. PCSX2 will boot
      to an error dialog rather than a game, and the broker cannot tell the
      difference: /status will look healthy while nothing plays. Copy a PS2
      BIOS dump there and restart the stack.
  when: pcsx2_bios_files.matched | int == 0

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result
