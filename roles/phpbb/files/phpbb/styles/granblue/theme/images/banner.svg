<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="340" viewBox="0 0 1920 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a3a"/>
      <stop offset="0.55" stop-color="#133567"/>
      <stop offset="1" stop-color="#1d4d8f"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d98a"/>
      <stop offset="0.45" stop-color="#d9a838"/>
      <stop offset="1" stop-color="#9c751f"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2c"/>
      <stop offset="1" stop-color="#4a2b10"/>
    </linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#b9c8e2"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="340" fill="url(#sky)"/>

  <!-- distant cloud banks -->
  <g fill="#2a5595" opacity="0.65">
    <ellipse cx="200" cy="300" rx="240" ry="42"/>
    <ellipse cx="620" cy="316" rx="300" ry="36"/>
    <ellipse cx="1240" cy="304" rx="280" ry="42"/>
    <ellipse cx="1720" cy="316" rx="320" ry="36"/>
  </g>
  <g fill="#3868a8" opacity="0.5">
    <ellipse cx="420" cy="322" rx="280" ry="30"/>
    <ellipse cx="1520" cy="324" rx="340" ry="28"/>
  </g>

  <!-- gold sparkles across the sky -->
  <g fill="#e6c169">
    <path d="M160 66 L162 72 L168 74 L162 76 L160 82 L158 76 L152 74 L158 72 Z" opacity="0.9"/>
    <path d="M420 44 L421.4 48 L425.4 49.4 L421.4 50.8 L420 54.8 L418.6 50.8 L414.6 49.4 L418.6 48 Z" opacity="0.75"/>
    <path d="M600 96 L601.4 100 L605.4 101.4 L601.4 102.8 L600 106.8 L598.6 102.8 L594.6 101.4 L598.6 100 Z" opacity="0.8"/>
    <path d="M900 52 L901.2 56 L905.2 57.2 L901.2 58.4 L900 62.4 L898.8 58.4 L894.8 57.2 L898.8 56 Z" opacity="0.7"/>
    <path d="M1020 120 L1021.4 124 L1025.4 125.4 L1021.4 126.8 L1020 130.8 L1018.6 126.8 L1014.6 125.4 L1018.6 124 Z" opacity="0.85"/>
    <path d="M1150 64 L1151 67 L1154 68 L1151 69 L1150 72 L1149 69 L1146 68 L1149 67 Z" opacity="0.6"/>
    <path d="M1800 96 L1801.4 100 L1805.4 101.4 L1801.4 102.8 L1800 106.8 L1798.6 102.8 L1794.6 101.4 L1798.6 100 Z" opacity="0.8"/>
    <circle cx="280" cy="120" r="2" opacity="0.8"/>
    <circle cx="840" cy="48" r="1.8" opacity="0.7"/>
    <circle cx="980" cy="132" r="1.9" opacity="0.75"/>
    <circle cx="1680" cy="48" r="1.8" opacity="0.7"/>
    <circle cx="540" cy="160" r="1.7" opacity="0.65"/>
    <circle cx="1900" cy="60" r="1.7" opacity="0.7"/>
  </g>

  <!-- the airship: balloon above, galleon hull below, in proportion -->
  <g transform="translate(1400,50)">
    <!-- balloon envelope: 150 wide, 90 tall, fully inside the box -->
    <path d="M75 4 C118 4 150 26 150 52 C150 74 132 88 75 88 C18 88 0 74 0 52 C0 26 32 4 75 4 Z"
          fill="url(#balloon)" stroke="#6d84ab" stroke-width="3"/>
    <!-- balloon seams -->
    <path d="M75 6 C52 26 52 66 75 86 M75 6 C98 26 98 66 75 86 M30 16 C18 34 18 58 30 80 M120 16 C132 34 132 58 120 80"
          fill="none" stroke="#96a9c9" stroke-width="2"/>
    <!-- gold keel band -->
    <rect x="2" y="84" width="146" height="10" rx="4" fill="url(#goldbar)" stroke="#7a5a15" stroke-width="1.6"/>
    <!-- rigging down to the hull -->
    <path d="M14 94 L40 128 M75 94 L75 126 M136 94 L110 128" stroke="#3c2a12" stroke-width="2.4"/>
    <!-- tail fin -->
    <path d="M148 34 L176 22 L170 52 Z" fill="#d9a838" stroke="#7a5a15" stroke-width="2.2"/>

    <!-- galleon hull: 190 wide, 64 tall -->
    <path d="M6 138 C10 122 34 114 95 114 C156 114 180 122 184 138 L176 156 C124 164 66 164 14 156 Z"
          fill="url(#hull)" stroke="#2e1a08" stroke-width="3"/>
    <!-- hull planks -->
    <path d="M16 132 L174 132 M20 142 L170 142" stroke="#5c3818" stroke-width="2"/>
    <!-- portholes -->
    <circle cx="48" cy="136" r="4.4" fill="#ffd76e" stroke="#2e1a08" stroke-width="1.6"/>
    <circle cx="95" cy="139" r="4.4" fill="#ffd76e" stroke="#2e1a08" stroke-width="1.6"/>
    <circle cx="142" cy="136" r="4.4" fill="#ffd76e" stroke="#2e1a08" stroke-width="1.6"/>
    <!-- cabin + flag -->
    <rect x="60" y="94" width="42" height="22" fill="#5c3818" stroke="#2e1a08" stroke-width="2"/>
    <path d="M102 94 L134 98 L102 104 Z" fill="#d94848" stroke="#2e1a08" stroke-width="1.6"/>
    <!-- sails between cabin and balloon keel -->
    <path d="M30 112 L30 96 L62 96 L62 112 Z" fill="#f1e6c8" stroke="#8a6a30" stroke-width="2"/>
    <path d="M112 112 L112 98 L142 98 L142 112 Z" fill="#e8dab6" stroke="#8a6a30" stroke-width="1.8"/>
  </g>

  <!-- ornate double frame -->
  <rect x="5" y="5" width="1910" height="330" fill="none" stroke="url(#goldbar)" stroke-width="9"/>
  <rect x="15" y="15" width="1890" height="310" fill="none" stroke="#8a6a1f" stroke-width="2.5"/>

  <!-- corner filigree curls -->
  <g fill="none" stroke="#e6c169" stroke-width="4" stroke-linecap="round">
    <path d="M26 58 C26 38 38 26 58 26 M26 42 C26 32 32 26 42 26"/>
    <path d="M1894 58 C1894 38 1882 26 1862 26 M1894 42 C1894 32 1888 26 1878 26"/>
    <path d="M26 282 C26 302 38 314 58 314 M26 296 C26 306 32 314 42 314"/>
    <path d="M1894 282 C1894 302 1882 314 1862 314 M1894 296 C1894 306 1888 314 1878 314"/>
  </g>
  <g fill="#e6c169">
    <path d="M44 44 L45.4 48 L49.4 49.4 L45.4 50.8 L44 54.8 L42.6 50.8 L38.6 49.4 L42.6 48 Z"/>
    <path d="M1876 44 L1877.4 48 L1881.4 49.4 L1877.4 50.8 L1876 54.8 L1874.6 50.8 L1870.6 49.4 L1874.6 48 Z"/>
    <path d="M44 296 L45.4 300 L49.4 301.4 L45.4 302.8 L44 306.8 L42.6 302.8 L38.6 301.4 L42.6 300 Z"/>
    <path d="M1876 296 L1877.4 300 L1881.4 301.4 L1877.4 302.8 L1876 306.8 L1874.6 302.8 L1870.6 301.4 L1874.6 300 Z"/>
  </g>

  <!-- left sparkle cluster around the title area -->
  <g fill="#f4d98a">
    <path d="M500 180 L503.4 190 L513.4 193.4 L503.4 196.8 L500 206.8 L496.6 196.8 L486.6 193.4 L496.6 190 Z" opacity="0.95"/>
    <path d="M560 138 L562 144 L568 146 L562 148 L560 154 L558 148 L552 146 L558 144 Z" opacity="0.8"/>
    <path d="M566 224 L567.4 228 L571.4 229.4 L567.4 230.8 L566 234.8 L564.6 230.8 L560.6 229.4 L564.6 228 Z" opacity="0.7"/>
    <path d="M436 208 L437.4 212 L441.4 213.4 L437.4 214.8 L436 218.8 L434.6 214.8 L430.6 213.4 L434.6 212 Z" opacity="0.7"/>
  </g>
</svg>
