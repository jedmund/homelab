---
degoog_4play_user: degoog-firefox
degoog_4play_group: degoog-firefox
degoog_4play_home: /home/degoog-firefox
degoog_4play_profile: "{{ degoog_4play_home }}/profile"

degoog_4play_degoog_host: nuc-mini
degoog_4play_upstream_host: "127.0.0.1"
degoog_4play_upstream_port: "{{ hostvars[degoog_4play_degoog_host].degoog_port | default(4444) }}"
degoog_4play_transport_id: degoog-org-official-extensions-lolcat-4play-transport
degoog_4play_transport_password: "{{ hostvars[degoog_4play_degoog_host].vault_degoog_4play_password | default('') }}"

degoog_4play_display: ":1"
degoog_4play_xauthority: /run/degoog-4play/Xauthority
degoog_4play_bridge_port: 3031

degoog_4play_extension_id: "{d58b1f6b-0386-4b99-9208-a1635ad8ae41}"
degoog_4play_extension_install_url: >-
  https://addons.mozilla.org/firefox/downloads/latest/4play/latest.xpi
degoog_4play_extension_ws_url: "ws://127.0.0.1:{{ degoog_4play_bridge_port }}/cnc"
degoog_4play_extension_ws_timeout: 30000
degoog_4play_firefox_version: 156.0
degoog_4play_firefox_url: >-
  https://download-installer.cdn.mozilla.net/pub/firefox/releases/{{
  degoog_4play_firefox_version }}/linux-x86_64/en-US/firefox-{{
  degoog_4play_firefox_version }}.tar.xz
degoog_4play_firefox_checksum: >-
  sha256:1d44cd02351c307c3e19061ea2a4d18a30f236e6be862b94f2282564afdb0167
degoog_4play_firefox_cache_dir: /var/cache/degoog-4play
degoog_4play_firefox_install_dir: /opt/degoog-4play
degoog_4play_firefox_binary: "{{ degoog_4play_firefox_install_dir }}/firefox/firefox"
degoog_4play_firefox_policy_path: >-
  {{ degoog_4play_firefox_install_dir }}/firefox/distribution/policies.json

degoog_4play_packages:
  - dbus-x11
  - nginx-core
  - openssl
  - x11-xserver-utils
  - xauth
  - xfce4
  - xorg
