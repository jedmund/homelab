---
# Strudel product stack

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/config/strudel"

- name: Deploy Strudel Dockerfile
  ansible.builtin.copy:
    src: strudel/Dockerfile
    dest: "{{ docker_base_path }}/{{ stack_name }}/config/strudel/Dockerfile"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: strudel_dockerfile

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Inspect strudel build requirements
  ansible.builtin.import_tasks: build.yml

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    # Explicitly override service build policies to avoid no-op rebuilds.
    build: "{{ 'always' if (strudel_build_required | default(true)) else 'never' }}"
    pull: policy
    remove_orphans: true
  register: compose_result

- name: Record successful strudel build inputs
  ansible.builtin.copy:
    content: "{{ {'fingerprint': strudel_build_fingerprint} | to_json }}\n"
    dest: "{{ docker_base_path }}/{{ stack_name }}/.ansible-build-inputs.json"
    owner: "{{ ansible_user }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - strudel_build_services | default([]) | length > 0
