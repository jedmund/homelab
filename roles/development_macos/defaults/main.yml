---
# Stack identity
stack_name: development_macos

# GitLab URL (matches roles/gitlab/defaults/main.yml — the runner
# talks to the same GitLab instance running on nuc-mini).
gitlab_root_url: "https://git.atelier.house"

# Vault secrets consumed by this role:
#   gitlab_runner_macos_auth_token

# GitLab Runner settings
gitlab_runner_macos_name: mac-mini-xcode
gitlab_runner_macos_concurrent: 2
gitlab_runner_macos_log_level: info
# Ansible commands run in a non-login shell, whose PATH does not include the
# Apple Silicon Homebrew prefix even after the formula is installed.
gitlab_runner_macos_binary: /opt/homebrew/bin/gitlab-runner
gitlab_runner_macos_brew_binary: /opt/homebrew/bin/brew
# launchd label and plist that `gitlab-runner install` generates.
gitlab_runner_macos_service_label: gitlab-runner
# Generated in the GitLab admin UI as a separate runner registration
# from the nuc-mini docker runner, then added to vault. Empty default
# lets the first deploy render config.toml without failing; runner
# will log auth errors until the token is populated.
gitlab_runner_macos_auth_token: ""

# Runs as the same user that ansible connects with (`justin` in the
# mac-mini inventory entry). User-mode is required for Xcode/keychain
# access; system-mode would run as root and break code signing.
gitlab_runner_macos_user: "{{ ansible_user }}"
gitlab_runner_macos_home: "/Users/{{ gitlab_runner_macos_user }}"
gitlab_runner_macos_config_dir: "{{ gitlab_runner_macos_home }}/.gitlab-runner"

# Log rotation.
#
# launchd owns the runner's stdout and stderr: it opens the paths in the
# LaunchAgent and hands the process descriptors that stay open for its whole
# life. Rename-based rotation is therefore wrong here. newsyslog would move
# the file aside, the runner would keep appending to the rotated inode, and
# once that generation aged out the space would not be reclaimed until the
# process exited. logrotate's copytruncate truncates in place instead, so the
# descriptor stays valid and writes resume at the start of the file.
#
# This is not hypothetical: a single repeated warning grew the error log to
# 311 MB over 24 days in August 2026 while nothing rotated it.
gitlab_runner_macos_logrotate: true
gitlab_runner_macos_log_files:
  - "{{ gitlab_runner_macos_home }}/gitlab-runner.err.log"
  - "{{ gitlab_runner_macos_home }}/gitlab-runner.out.log"
gitlab_runner_macos_log_max_size: 10M
gitlab_runner_macos_log_keep: 5
gitlab_runner_macos_logrotate_dir: /opt/homebrew/etc/logrotate.d
# Label Homebrew gives the logrotate agent. Runs daily at 06:00.
gitlab_runner_macos_logrotate_label: homebrew.mxcl.logrotate

# CI Ruby toolchain. mise owns the pinned runtime; application Gemfiles own
# Fastlane and other project dependencies. Do not change the user's global Ruby.
development_macos_mise_binary: /opt/homebrew/bin/mise
development_macos_mise_data_dir: "{{ gitlab_runner_macos_home }}/.local/share/mise"
development_macos_ruby_version: "3.4.11"
development_macos_ruby_prefix: "{{ development_macos_mise_data_dir }}/installs/ruby/{{ development_macos_ruby_version }}"
development_macos_bundler_version: "2.6.7"
development_macos_gem_home: "{{ gitlab_runner_macos_home }}/.local/share/gitlab-runner/gems/ruby-3.4"
development_macos_job_path:
  - "{{ development_macos_gem_home }}/bin"
  - "{{ development_macos_ruby_prefix }}/bin"
  - /opt/homebrew/bin
  - /opt/homebrew/sbin
  - /usr/local/bin
  - /usr/bin
  - /bin
  - /usr/sbin
  - /sbin
# The runner exports these after starting its login shell. Interactive shell
# profiles and launchd's minimal PATH cannot select the system Ruby instead.
development_macos_job_environment:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PATH: "{{ development_macos_job_path | join(':') }}"
  GEM_HOME: "{{ development_macos_gem_home }}"
  GEM_PATH: "{{ development_macos_gem_home }}"
