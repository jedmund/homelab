---
# RomM product stack

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/env"
    - "{{ docker_base_path }}/{{ stack_name }}/config"

- name: Deploy environment file
  ansible.builtin.template:
    src: env/romm.env.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/romm.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: romm_deploy_environment_file

# Preserve UI-owned configuration while migrating the retired folder keys.
- name: Check existing RomM config.yml
  ansible.builtin.stat:
    path: "{{ config_base }}/config/config.yml"
  register: romm_config_stat

- name: Read existing RomM config.yml
  ansible.builtin.slurp:
    src: "{{ config_base }}/config/config.yml"
  register: romm_config_raw
  when: romm_config_stat.stat.exists
  no_log: true

- name: Validate legacy RomM filesystem layout
  ansible.builtin.assert:
    that:
      - romm_existing_filesystem.get('roms_folder', 'roms') == 'roms'
      - romm_existing_filesystem.get('firmware_folder', 'bios') == 'bios'
    fail_msg: "Custom legacy folders require an explicit filesystem migration before upgrading RomM."
  vars:
    romm_existing_config: "{{ (romm_config_raw.content | default('') | b64decode | from_yaml) or {} }}"
    romm_existing_filesystem: "{{ romm_existing_config.get('filesystem', {}) }}"

- name: Merge streaming and filesystem settings into config.yml
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ config_base }}/config/config.yml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  vars:
    romm_existing_config: "{{ (romm_config_raw.content | default('') | b64decode | from_yaml) or {} }}"
  register: romm_merge_streaming_settings_into_config_yml
  no_log: true

# Hash app configuration into its Compose definition so only RomM is recreated.
- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  vars:
    romm_existing_config: "{{ (romm_config_raw.content | default('') | b64decode | from_yaml) or {} }}"

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    wait: true
    wait_timeout: "{{ romm_deploy_wait_timeout }}"
    recreate: auto
  register: compose_result
