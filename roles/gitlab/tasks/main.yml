---
# GitLab product stack: GitLab, Docker runner, and Renovate.

# CI jobs on the Docker runner (Vite/Vitest, webpack, tsc --watch, etc.) each
# open many per-file inotify watchers. The kernel default
# fs.inotify.max_user_instances=128 is far too low: inotify_init() starts
# returning EMFILE once a job crosses it, and the job dies with
# "EMFILE: too many open files" during watcher setup even though no fds are
# leaking (raising ulimit -n does NOT help — it's the instance cap, not the fd
# cap). Raise it host-wide via a sysctl.d drop-in so it survives reboots and
# applies to every runner container on the box.
- name: Raise inotify instance limit for CI runner file watchers
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "{{ gitlab_runner_inotify_max_user_instances }}"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-gitlab-runner-inotify.conf

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/env"
    - "{{ docker_base_path }}/{{ stack_name }}/config"
    - "{{ docker_base_path }}/{{ stack_name }}/logs"
    - "{{ docker_base_path }}/{{ stack_name }}/data"
    - "{{ docker_base_path }}/{{ stack_name }}/runner"
    - "{{ docker_base_path }}/{{ stack_name }}/runner/config"
    - "{{ docker_base_path }}/{{ stack_name }}/renovate"
    - "{{ docker_base_path }}/{{ stack_name }}/config/gitlab-cache"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment files
  ansible.builtin.template:
    src: "env/{{ item }}.env.j2"
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/{{ item }}.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - gitlab
    - renovate
    - gitlab-cache-garage
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Deploy CI cache Garage config
  ansible.builtin.template:
    src: gitlab-cache/garage.toml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/config/gitlab-cache/garage.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Deploy GitLab omnibus config
  ansible.builtin.template:
    src: gitlab/gitlab.rb.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/config/gitlab.rb"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Reconfigure GitLab if running

- name: Deploy GitLab Runner config
  ansible.builtin.template:
    src: gitlab-runner/config.toml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/runner/config/config.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Deploy Renovate config
  ansible.builtin.template:
    src: renovate/config.js.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/renovate/config.js"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Schedule GitLab application-consistent backup
  ansible.builtin.cron:
    name: gitlab-backup
    user: "{{ ansible_user }}"
    job: "docker exec gitlab gitlab-backup create SKIP={{ gitlab_backup_skip }} CRON=1 >> /var/log/gitlab-backup.log 2>&1"
    minute: "{{ gitlab_backup_cron.split(' ')[0] }}"
    hour: "{{ gitlab_backup_cron.split(' ')[1] }}"
    day: "{{ gitlab_backup_cron.split(' ')[2] }}"
    month: "{{ gitlab_backup_cron.split(' ')[3] }}"
    weekday: "{{ gitlab_backup_cron.split(' ')[4] }}"

- name: Schedule Renovate weekly run
  ansible.builtin.cron:
    name: renovate
    user: "{{ ansible_user }}"
    job: "docker compose -f {{ docker_base_path }}/{{ stack_name }}/compose.yaml run --rm renovate >> /var/log/renovate.log 2>&1"
    minute: "{{ renovate_schedule_cron.split(' ')[0] }}"
    hour: "{{ renovate_schedule_cron.split(' ')[1] }}"
    day: "{{ renovate_schedule_cron.split(' ')[2] }}"
    month: "{{ renovate_schedule_cron.split(' ')[3] }}"
    weekday: "{{ renovate_schedule_cron.split(' ')[4] }}"

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result

# The one-time files/ci_cache_bootstrap.sh handles layout + bucket + key
# creation (the key secret has to be captured into the vault by a human).
# Re-granting the key access to the bucket is idempotent, so wire it here to
# self-heal on every deploy. Gated on the vaulted key being present and the
# bucket existing, so a pre-bootstrap host skips cleanly.
- name: Ensure CI cache bucket access
  when: gitlab_cache_s3_access_key_id | length > 0
  block:
    - name: Check the CI cache bucket exists
      ansible.builtin.command: docker exec gitlab-cache-garage /garage bucket info {{ gitlab_cache_s3_bucket }}
      register: gitlab_cache_bucket_info
      changed_when: false
      failed_when: false

    - name: Grant the CI cache key read+write+owner on the bucket
      ansible.builtin.command: >-
        docker exec gitlab-cache-garage /garage bucket allow
        --read --write --owner {{ gitlab_cache_s3_bucket }}
        --key {{ gitlab_cache_s3_access_key_id }}
      changed_when: false
      when: gitlab_cache_bucket_info.rc == 0
