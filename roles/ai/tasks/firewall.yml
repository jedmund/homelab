---
- name: Validate llama-swap bindings
  ansible.builtin.assert:
    that:
      - ai_llama_swap_bind_address is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
      - ai_llama_swap_bind_address not in ['0.0.0.0', '127.0.0.1']
      - llama_swap_port | int > 1024
      - llama_swap_port | int < 65536

- name: Validate llama-swap allowed sources
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/([1-9]|[12][0-9]|3[0-2])$')
  loop: "{{ ai_llama_swap_allowed_sources }}"

- name: Install nftables tools without enabling a global ruleset
  ansible.builtin.apt:
    name: nftables
    state: present
    policy_rc_d: 101

- name: Create llama-swap firewall directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/ai
    - /etc/systemd/system/docker.service.d

- name: Render and validate the llama-swap firewall table
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: /etc/ai/llama-swap-firewall.nft
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/nft --check --file %s
  register: ai_llama_swap_firewall_config

- name: Install llama-swap firewall unit
  ansible.builtin.template:
    src: firewall.service.j2
    dest: /etc/systemd/system/ai-llama-swap-firewall.service
    owner: root
    group: root
    mode: '0644'
  register: ai_llama_swap_firewall_unit

- name: Order Docker startup after the llama-swap restriction
  ansible.builtin.template:
    src: docker-firewall.conf.j2
    dest: /etc/systemd/system/docker.service.d/20-ai-llama-swap-firewall.conf
    owner: root
    group: root
    mode: '0644'
  register: ai_llama_swap_docker_dropin

- name: Inspect the live llama-swap firewall table
  ansible.builtin.command: nft list table inet homelab_llama_swap
  register: ai_llama_swap_firewall_live
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load llama-swap firewall before publishing any ports
  ansible.builtin.systemd_service:
    name: ai-llama-swap-firewall.service
    enabled: true
    daemon_reload: "{{ ai_llama_swap_firewall_unit.changed or ai_llama_swap_docker_dropin.changed }}"
    # Restarting a required unit also restarts Docker. ExecReload applies
    # rules without stopping the dependency or its containers.
    state: >-
      {{ 'reloaded' if ai_llama_swap_firewall_config.changed or
         ai_llama_swap_firewall_unit.changed or ai_llama_swap_firewall_live.rc != 0
         else 'started' }}
  when: not ansible_check_mode
