---
# Album Sort product stack. GitLab CI builds both images and asks Komodo to
# redeploy after successful main builds; this role renders deployment state.
#
# Bootstrap ordering:
#   1. Populate the registry and PocketID vault entries.
#   2. Run the Album Sort playbook to render and start the stack.
#   3. Keep the Komodo Stack resource named `album-sort` pointed at
#      /opt/docker/album-sort with files_on_host=true.
#   4. Set KOMODO_URL, KOMODO_API_KEY, KOMODO_API_SECRET, and
#      KOMODO_ALBUM_SORT_STACK=album-sort in the GitLab project.

- name: Validate Album Sort native OIDC configuration
  ansible.builtin.assert:
    that:
      - album_sort_oidc_client_id | length > 0
      - album_sort_oidc_client_secret | length > 0
    fail_msg: >-
      Populate the PocketID client ID and secret before deploying Album Sort.

- name: Inspect the proxy network for its current subnet
  community.docker.docker_network_info:
    name: "{{ proxy_network }}"
  register: album_sort_proxy_network
  failed_when: false

- name: Resolve the trusted proxy CIDR from the proxy network
  ansible.builtin.set_fact:
    album_sort_trusted_proxy_cidrs: >-
      {{ (album_sort_proxy_network.network.IPAM.Config
          | map(attribute='Subnet') | join(','))
         if (album_sort_proxy_network.exists | default(false))
            and (album_sort_proxy_network.network.IPAM.Config | default([]) | length > 0)
         else album_sort_trusted_proxy_cidrs }}

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/data"
    - "{{ config_base }}/beets-data"

- name: Ensure non-root containers own existing state
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
  loop:
    - "{{ config_base }}/data"
    - "{{ config_base }}/beets-data"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment file
  ansible.builtin.template:
    src: env/album-sort.env.j2
    dest: "{{ config_base }}/env/album-sort.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Authenticate with Album Sort image registry
  community.docker.docker_login:
    registry_url: "{{ album_sort_registry_url }}"
    username: "{{ album_sort_registry_username }}"
    password: "{{ album_sort_registry_password }}"
  when: album_sort_registry_username | length > 0 and album_sort_registry_password | length > 0
  no_log: true

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result

- name: Wait for Album Sort container health
  community.docker.docker_container_info:
    name: album_sort
  register: album_sort_container
  retries: 20
  delay: 3
  until:
    - album_sort_container.exists
    - album_sort_container.container.State.Health.Status == 'healthy'
  changed_when: false

- name: Print native OIDC rollout state
  ansible.builtin.debug:
    msg: >-
      Album Sort {{ album_sort_image_tag }} is healthy. TinyAuth transition
      middleware is {{ 'enabled' if album_sort_use_tinyauth else 'disabled' }};
      filesystem mutations are {{ 'enabled' if album_sort_mutations_enabled == 'true' else 'disabled' }}.
