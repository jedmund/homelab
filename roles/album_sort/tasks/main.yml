---
# Album Sort product stack. GitLab CI builds both images; this role only pulls
# immutable tags and renders deployment state.

- name: Validate Album Sort release and native OIDC configuration
  ansible.builtin.assert:
    that:
      - album_sort_image_tag is match('^[0-9a-f]{40}$')
      - album_sort_oidc_client_id | length > 0
      - album_sort_oidc_client_secret | length > 0
    fail_msg: >-
      Set vault_album_sort_image_tag to a full Git commit SHA and populate the
      PocketID client ID/secret before deploying Album Sort.

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/data"
    - "{{ config_base }}/beets-data"

- name: Ensure non-root containers own existing state
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
  loop:
    - "{{ config_base }}/data"
    - "{{ config_base }}/beets-data"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment file
  ansible.builtin.template:
    src: env/album-sort.env.j2
    dest: "{{ config_base }}/env/album-sort.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Authenticate with Album Sort image registry
  community.docker.docker_login:
    registry_url: "{{ album_sort_registry_url }}"
    username: "{{ album_sort_registry_username }}"
    password: "{{ album_sort_registry_password }}"
  when: album_sort_registry_username | length > 0 and album_sort_registry_password | length > 0
  no_log: true

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: always
  register: compose_result

- name: Wait for Album Sort container health
  community.docker.docker_container_info:
    name: album_sort
  register: album_sort_container
  retries: 20
  delay: 3
  until:
    - album_sort_container.exists
    - album_sort_container.container.State.Health.Status == 'healthy'
  changed_when: false

- name: Remove retired Album Sort host-port firewall rule
  community.general.ufw:
    rule: allow
    port: "5180"
    proto: tcp
    delete: true
  when: firewall_enabled | default(true) | bool

- name: Print native OIDC rollout state
  ansible.builtin.debug:
    msg: >-
      Album Sort {{ album_sort_image_tag }} is healthy. TinyAuth transition
      middleware is {{ 'enabled' if album_sort_use_tinyauth else 'disabled' }};
      filesystem mutations are {{ 'enabled' if album_sort_mutations_enabled == 'true' else 'disabled' }}.
