---
# Stack identity
stack_name: album-sort
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Album Sort images are built by GitLab CI and published as a short SHA, branch
# slug, and `latest`. `latest` is published only from the default branch, then CI
# calls Komodo to redeploy this stack. Set this to a short SHA for a deploy freeze
# or rollback.
album_sort_image: registry.atelier.house/jedmund/album-sort
album_sort_beets_image: registry.atelier.house/jedmund/album-sort/beets
album_sort_image_tag: latest
album_sort_registry_url: https://registry.atelier.house
album_sort_registry_username: "{{ vault_album_sort_registry_username | default('') }}"
album_sort_registry_password: "{{ vault_album_sort_registry_password | default('') }}"
album_sort_container_port: 3000
album_sort_domain: music.sort.atelier.house
album_sort_origin: "https://{{ album_sort_domain }}"
album_sort_unsorted_path: /music/Sort
album_sort_sorted_path: /music/Sorted
album_sort_data_path: /data
album_sort_watch_interval: "30000"
album_sort_scan_concurrency: "4"
album_sort_musicbrainz_base_url: "http://musicbrainz:5000/ws/2"
album_sort_cover_art_archive_base_url: "https://coverartarchive.org"
album_sort_auth_required: "true"
album_sort_mutations_enabled: "true"
album_sort_oidc_issuer_url: "https://id.atelier.house"
album_sort_oidc_client_id: "{{ vault_album_sort_oidc_client_id | default('') }}"
album_sort_oidc_client_secret: "{{ vault_album_sort_oidc_client_secret | default('') }}"
album_sort_session_ttl_hours: "12"

# Keep the outer middleware during native-OIDC rollout. Set false only after
# login, callback, logout, and unauthenticated rejection are verified.
album_sort_use_tinyauth: true

# OpenSubsonic REST API (`/rest`). Music clients authenticate per-request with
# the Subsonic protocol's own credentials, so this path must bypass the outer
# tinyauth middleware: tinyauth's browser SSO flow rejects them before the app
# ever sees the request. Setting this false removes the bypass router and takes
# every OpenSubsonic client offline.
album_sort_expose_rest_api: true

# Persistent canonical base64 of 32 random bytes. Never generate on deployment:
# losing/changing this key invalidates named legacy client credentials.
album_sort_user_secret_encryption_key: "{{ vault_album_sort_user_secret_encryption_key | default('') }}"

# Peers whose X-Forwarded-Proto Album Sort may trust when deciding whether a
# /rest request arrived over TLS. Traefik terminates TLS and forwards an
# internal HTTP hop, so this assertion is the only way a production request
# satisfies the transport predicate: under adapter-node the request URL scheme
# is derived from ORIGIN, not from the socket, so it is not a transport fact.
# Trusting a peer lets it assert transport only; it never authenticates.
#
# The role resolves the actual Traefik address to /32 and fails if absent.
# Pin Traefik's proxy address in inventory so recreation cannot stale this trust.
album_sort_trusted_proxy_cidrs: ""

# Multi-Scrobbler integration
album_sort_multi_scrobbler_url: "http://multi-scrobbler:9078"

# Secrets defined in vault:
# album_sort_apple_music_team_id, album_sort_apple_music_key_id,
# album_sort_apple_music_private_key, album_sort_discogs_token,
# album_sort_kagi_api_key, album_sort_multi_scrobbler_token,
# vault_album_sort_registry_username, vault_album_sort_registry_password,
# vault_album_sort_oidc_client_id,
# vault_album_sort_oidc_client_secret,
# vault_album_sort_user_secret_encryption_key
