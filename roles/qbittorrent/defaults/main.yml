---
# Stack identity
stack_name: qbittorrent
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# qBittorrent settings
qbittorrent_image: lscr.io/linuxserver/qbittorrent:latest
# Web UI port inside gluetun's network namespace, where SABnzbd already
# listens on 8080. gluetun publishes it on host port 8080 and carries the
# qbittorrent alias, so other containers use http://qbittorrent:8090.
qbittorrent_webui_port: 8090

# Port sync: sets qBittorrent's listening port to the port gluetun forwards
# for it. gluetun lists forwarded ports in ascending order and slskd takes the
# first, so qBittorrent takes the second (zero-based index 1).
qbittorrent_port_sync_image: curlimages/curl:8.23.0
qbittorrent_forwarded_port_index: 1
qbittorrent_port_sync_interval: 30
# Shared with gluetun's control server role (group_vars/gluetun/vault.yml)
qbittorrent_gluetun_api_key: "{{ vault_gluetun_control_server_api_key | default('') }}"
