---
- name: Require reviewed immutable images and dedicated secrets
  ansible.builtin.assert:
    that:
      - kaneo_inspection_adapter_image is match('^.+@sha256:[a-f0-9]{64}$')
      - kaneo_inspection_paseo_image is match('^.+@sha256:[a-f0-9]{64}$')
      - kaneo_inspection_catalog | length > 0
      - kaneo_inspection_bearer_token | length >= 32
      - kaneo_inspection_paseo_password is match('^[a-f0-9]{64}$')
      - kaneo_inspection_git_username | length > 0
      - kaneo_inspection_git_token | length > 0
      - (vault_kaneo_agent_service_encryption_key | default('') | length) >= 32
  no_log: true

- name: Create isolated persistent directories
  ansible.builtin.file:
    path: "{{ kaneo_inspection_root }}/{{ item }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'
  loop: ['', state, snapshots, paseo, paseo/paseo, secrets]

- name: Create private Kaneo-to-adapter network
  community.docker.docker_network:
    name: "{{ kaneo_inspection_api_network }}"
    internal: true

- name: Write the operator-approved repository catalog
  ansible.builtin.copy:
    dest: "{{ kaneo_inspection_root }}/catalog.json"
    content: "{{ kaneo_inspection_catalog | to_nice_json }}"
    owner: '1000'
    group: '1000'
    mode: '0400'

- name: Write read-only Git credentials
  ansible.builtin.copy:
    dest: "{{ kaneo_inspection_root }}/secrets/{{ item.name }}"
    content: "{{ item.value }}"
    owner: '1000'
    group: '1000'
    mode: '0400'
  loop:
    - {name: git-username, value: '{{ kaneo_inspection_git_username }}'}
    - {name: git-token, value: '{{ kaneo_inspection_git_token }}'}
  no_log: true

- name: Write the Git credential reader
  ansible.builtin.copy:
    dest: "{{ kaneo_inspection_root }}/git-askpass"
    owner: '1000'
    group: '1000'
    mode: '0500'
    content: |
      #!/bin/sh
      case "$1" in
        *Username*) cat /run/secrets/git-username ;;
        *Password*) cat /run/secrets/git-token ;;
        *) exit 1 ;;
      esac

- name: Configure only the managed local provider
  ansible.builtin.copy:
    dest: "{{ kaneo_inspection_root }}/paseo/paseo/config.json"
    owner: '1000'
    group: '1000'
    mode: '0600'
    content: |
      {
        "daemon": {"mcp": {"enabled": false, "injectIntoAgents": false}},
        "agents": {"providers": {
          "claude": {"enabled": false}, "codex": {"enabled": false}, "pi": {"enabled": false},
          "opencode": {"enabled": true, "command": ["node", "/app/apps/inspection-adapter/deadline-wrapper.mjs"]}
        }}
      }

- name: Write service environments
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ kaneo_inspection_root }}/{{ item }}"
    owner: '1000'
    group: '1000'
    mode: '0600'
  loop: [adapter.env, paseo.env]
  no_log: true

- name: Render the isolated inspection stack
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ kaneo_inspection_root }}/compose.yaml"
    mode: '0644'

- name: Start only the dedicated inspection stack
  community.docker.docker_compose_v2:
    project_src: "{{ kaneo_inspection_root }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
