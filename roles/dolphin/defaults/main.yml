---
# Stack identity
stack_name: dolphin
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Dolphin running headless on max, streamed to the browser via Selkies and
# driven by RomM over the broker sidecar. See roles/romm for the client
# half (the streaming block in config.yml).
#
# GameCube and Wii only. RomM's docs list wiiu against Dolphin, but
# Dolphin does not emulate the Wii U, so only ngc and wii are wired up.
dolphin_image: lscr.io/linuxserver/dolphin:latest

# Docker Mod that installs the RomM broker as an s6 service inside the
# LinuxServer image. Pinned to a minor tag so patch releases land on
# deploy but a breaking API change does not.
# https://github.com/LoneAngelFayt/dolphin-romm-integration
dolphin_broker_mod: ghcr.io/loneangelfayt/dolphin-romm-integration-mod:v1

# Host ports. Offset from the pcsx2 role's block so the two stacks can run
# side by side on max. Container-side ports are fixed by the image.
dolphin_selkies_http_port: 3020
dolphin_selkies_https_port: 3021
dolphin_broker_port: 8020

# GPU pinning. Same card as pcsx2: both emulators sit idle on their
# dashboards most of the time, and consolidating them onto one device
# keeps the other two cards clear for the AI stack. See the VRAM note in
# roles/romm/README.md.
dolphin_gpu_device_id: "2"

# Must match where RomM mounts the same library, or every launch 422s.
dolphin_rom_root: /romm/library

# Dolphin has eight state slots but RomM exposes no slot picker, so every
# save and load funnels through this one.
dolphin_save_slot: "8"

# Selkies needs a real chunk of shared memory for the framebuffer.
dolphin_shm_size: 1gb

dolphin_broker_log_level: INFO

# Basic auth on the container's own Selkies listener. Second gate behind
# TinyAuth on the Traefik route; covers direct LAN access to max:3021.
dolphin_selkies_user: justin
dolphin_selkies_password: "{{ vault_dolphin_selkies_password }}"

# Same shared vault entry as roles/pcsx2 and roles/romm; see the note
# there for why it is not per-group.
dolphin_broker_secret: "{{ vault_romm_streaming_broker_secret }}"
