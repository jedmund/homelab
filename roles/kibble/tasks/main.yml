---
# Kibble stack — local-first PetLibro PLAF203 control plane.  Image
# is built by GitLab CI in jedmund/kibble and pulled here; this role
# does not build from source.
#
# Bootstrap ordering (one-time, manual):
#   1. Populate vault entries — see roles/kibble/defaults/main.yml.
#   2. First `make deploy-kibble` brings up the stack.
#   3. Register a Komodo Stack resource named `kibble` (the value
#      of KOMODO_KIBBLE_STACK in CI) pointing at /opt/docker/feederhub
#      with files_on_host=true so CI-triggered redeploys land on the
#      same compose Ansible just rendered.
#   4. Set CI variables in the jedmund/kibble GitLab project:
#        KOMODO_URL, KOMODO_API_KEY, KOMODO_API_SECRET,
#        KOMODO_KIBBLE_STACK=kibble
#   5. Cat-photo storage (optional, kibble's own Garage):
#      vault vault_feederhub_garage_rpc_secret (openssl rand -hex 32),
#      redeploy, run {{ config_base }}/garage_bootstrap.sh on the host
#      (creates bucket + key, prints the key), vault the key as
#      vault_feederhub_s3_access_key_id / _secret_access_key, redeploy
#      again so kibble.env picks up KIBBLE_S3_*.

# ---- ONVIF LAN VIPs on macvlan children ---------------------------
# Each feeder is exposed as an independent ONVIF camera at its own LAN
# VIP.  The VIPs MUST sit on macvlan child interfaces of br0 (each
# with its own MAC) rather than as alias IPs on br0 itself — UniFi
# Protect dedupes adopted cameras on the link-layer MAC obtained via
# ARP, and alias IPs all ARP back with the bridge's real MAC, so a
# second adoption silently replaces the first.

- name: Remove legacy alias-IP systemd-networkd drop-in (superseded by macvlan)
  ansible.builtin.file:
    path: /etc/systemd/network/50-kibble-onvif-vips.network
    state: absent
  notify: Reload systemd-networkd

- name: Remove legacy alias IPs from {{ kibble_onvif_bridge }} if present
  ansible.builtin.command:
    cmd: "ip address del {{ item.ip }}/24 dev {{ kibble_onvif_bridge }}"
  loop: "{{ kibble_onvif_devices }}"
  loop_control:
    label: "{{ item.ip }}"
  register: vip_legacy_del
  changed_when: vip_legacy_del.rc == 0
  # Idempotent cleanup: tolerate the two benign "nothing to remove"
  # messages so re-runs after the alias IPs are already gone don't abort
  # the play. `ip addr del` reports "Address not found." when the address
  # isn't on the interface (the normal case now that the VIPs live on
  # macvlan children); older iproute2 emits "Cannot assign requested
  # address". Any other non-zero rc (e.g. missing device) still fails.
  failed_when:
    - vip_legacy_del.rc != 0
    - "'Cannot assign requested address' not in vip_legacy_del.stderr"
    - "'Address not found' not in vip_legacy_del.stderr"
  when: kibble_onvif_enabled | bool

- name: Install kibble-onvif-vips systemd unit
  ansible.builtin.template:
    src: systemd/kibble-onvif-vips.service.j2
    dest: /etc/systemd/system/kibble-onvif-vips.service
    owner: root
    group: root
    mode: '0644'
  when: kibble_onvif_enabled | bool
  register: vip_unit

- name: Reload systemd to pick up kibble-onvif-vips.service
  ansible.builtin.systemd:
    daemon_reload: true
  when: vip_unit.changed

- name: Enable + start kibble-onvif-vips
  ansible.builtin.systemd:
    name: kibble-onvif-vips.service
    enabled: true
    state: started
  when: kibble_onvif_enabled | bool

# Restart (not just start) only when the unit file actually changed, so
# unchanged re-runs don't flap the ONVIF VIP interfaces.
- name: Restart kibble-onvif-vips on unit change
  ansible.builtin.systemd:
    name: kibble-onvif-vips.service
    state: restarted
  when:
    - kibble_onvif_enabled | bool
    - vip_unit.changed

# Lower the host's "privileged port" cutoff so kibble's distroless
# nonroot process can bind port 80 on its VIPs.  `cap_add` in compose
# alone isn't sufficient — it adds to the container's permitted set
# but not the ambient set, so the uid-65532 process still gets EACCES
# on bind(0.0.0.0:80).  Setting ip_unprivileged_port_start=80
# eliminates the privilege check for any port >= 80, which is what we
# want here.  Host-wide change, but the only ports < 1024 that anyone
# on the nuc binds are 80 (traefik), 443 (traefik), 22 (sshd) — all
# already run with root.
- name: Lower privileged-port cutoff so nonroot can bind :80
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '80'
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/50-kibble-unprivileged-ports.conf
  when: kibble_onvif_enabled | bool

# Prevent ARP flux across the per-feeder ONVIF VIPs.  The VIPs are
# macvlan children of br0, so with the default arp_ignore=0 the host
# answers ARP for any local IP from any interface — all VIPs collapse
# onto a single MAC as seen from the LAN (and it flaps between them).
# UniFi Protect fingerprints ONVIF cameras by MAC, so it then sees one
# device at N IPs and offers only one for adoption.  arp_ignore=1 makes
# each VIP answer only for its own address; arp_announce=2 keeps the
# outbound ARP source address correct.  Host-wide, standard multi-IP
# hardening (the nuc's other services all live on br0's own .6).
- name: Prevent ARP flux across ONVIF VIPs (per-VIP MAC on the LAN)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/51-kibble-onvif-arp.conf
  loop:
    - { name: net.ipv4.conf.all.arp_ignore, value: '1' }
    - { name: net.ipv4.conf.all.arp_announce, value: '2' }
  when: kibble_onvif_enabled | bool

# ---- Take over Kalay from the external kalay-mock unit ------------
# kibble's in-process Kalay master binds the same UDP ports (10001,
# 10240) as the host-level kalay-mock systemd unit shipped by
# roles/petlibro/.  When kibble owns Kalay that unit must be down,
# or the container fails to bind on start.  Stop it BEFORE the compose
# up below.  roles/petlibro also gates kalay-mock behind
# `petlibro_kalay_mock_enabled: false` so a petlibro redeploy won't
# resurrect it — this task is the belt to that role's suspenders and
# makes `make deploy-kibble` self-sufficient.
- name: Check whether the legacy kalay-mock unit is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/kalay-mock.service
  register: kibble_kalay_mock_unit
  when: kibble_kalay_enabled | bool

- name: Stop + disable the legacy kalay-mock unit (kibble owns Kalay now)
  ansible.builtin.systemd:
    name: kalay-mock.service
    state: stopped
    enabled: false
  when:
    - kibble_kalay_enabled | bool
    - kibble_kalay_mock_unit.stat.exists | default(false)

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"

# Kibble's distroless image runs as uid 65532; the data dir must be
# owned by that uid for the SQLite DB to land. Uses data_name (feederhub)
# so it ensures the existing pre-rename data dir, not a fresh one.
- name: Create kibble data directory
  file:
    path: "{{ config_base }}/config/{{ data_name }}"
    state: directory
    owner: "{{ kibble_data_uid }}"
    group: "{{ kibble_data_gid }}"
    mode: '0750'

# ---- kibble's own Garage (cat photos) --------------------------
# Whole sub-stack gated on the vault rpc secret: without it the
# compose template omits the garage service, no config lands, and
# kibble runs with photo endpoints disabled (503). One-time bucket
# + key creation lives in garage_bootstrap.sh (a human captures the
# generated key into the vault); see the bootstrap ordering comment
# at the top of this file.
- name: Deploy kibble Garage config + bootstrap
  when: kibble_garage_rpc_secret | length > 0
  block:
    - name: Create Garage config directory
      file:
        path: "{{ config_base }}/config/garage"
        state: directory
        owner: "{{ ansible_user }}"
        mode: '0755'

    - name: Deploy garage.toml
      template:
        src: garage.toml.j2
        dest: "{{ config_base }}/config/garage/garage.toml"
        owner: "{{ ansible_user }}"
        mode: '0600'
      no_log: true
      notify: Restart {{ stack_name }} stack

    - name: Deploy garage_bootstrap.sh
      copy:
        src: garage_bootstrap.sh
        dest: "{{ config_base }}/garage_bootstrap.sh"
        owner: "{{ ansible_user }}"
        mode: '0755'

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment file
  template:
    src: env/kibble.env.j2
    dest: "{{ config_base }}/env/kibble.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Authenticate with kibble image registry
  community.docker.docker_login:
    registry_url: "{{ kibble_registry_url }}"
    username: "{{ kibble_registry_username }}"
    password: "{{ kibble_registry_password }}"
  when: kibble_registry_username | length > 0 and kibble_registry_password | length > 0
  no_log: true

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result

# Deploy self-heal (the kizuna role's lesson: a key existing with no
# bucket grant fails silently at runtime). `bucket allow` is additive
# and idempotent, so re-assert it every run once the vault key exists
# and the bucket has been bootstrapped; a pre-bootstrap host skips
# cleanly on the rc check.
- name: Ensure Garage bucket access for the app key
  when:
    - kibble_garage_rpc_secret | length > 0
    - kibble_s3_access_key_id | length > 0
  block:
    - name: Check the Garage bucket exists
      command: docker exec kibble-garage /garage bucket info {{ kibble_s3_bucket }}
      register: kibble_garage_bucket_info
      changed_when: false
      failed_when: false

    - name: Grant the app key read+write+owner on the bucket
      command: >-
        docker exec kibble-garage /garage bucket allow
        --read --write --owner {{ kibble_s3_bucket }}
        --key {{ kibble_s3_access_key_id }}
      changed_when: false
      when: kibble_garage_bucket_info.rc == 0
