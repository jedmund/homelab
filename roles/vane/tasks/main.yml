---
# Vane stack — standalone AI answering engine. Images are built in GitLab CI
# and pulled here; this role does not build from source.
#
# Bootstrap ordering:
#   1. Deploy this role; it mounts the existing utilities_vane-data volume.
#   2. Register a Komodo Stack resource named `vane` with files_on_host=true
#      and project_src={{ config_base }} so CI-triggered redeploys target the
#      same compose file Ansible renders.

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy environment file
  template:
    src: env/vane.env.j2
    dest: "{{ config_base }}/env/vane.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: vane_deploy_environment_file

- name: Authenticate with Vane image registry
  community.docker.docker_login:
    registry_url: "{{ vane_registry_url }}"
    username: "{{ vane_registry_username }}"
    password: "{{ vane_registry_password }}"
  when:
    - vane_enabled | bool
    - vane_registry_username | length > 0 and vane_registry_password | length > 0
  no_log: true

- name: Inspect the retained Vane container
  community.docker.docker_container_info:
    name: vane
  register: vane_existing_container
  no_log: true

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (vane_deploy_environment_file.changed | default(false))
         else 'auto' }}
  register: compose_result
  when: vane_enabled | bool

# Compose's stopped state first runs up --no-start and can recreate the
# container. Stop only the existing container here to preserve its identity.
- name: Stop and disable restart for the retained Vane container
  community.docker.docker_container:
    name: vane
    state: stopped
    restart_policy: "no"
  no_log: true
  when:
    - not vane_enabled | bool
    - vane_existing_container.exists | default(false)

- name: Restore the retained container restart policy when enabling Vane
  ansible.builtin.command:
    argv:
      - docker
      - update
      - "--restart={{ restart_policy }}"
      - vane
  changed_when: true
  when:
    - vane_enabled | bool
    - vane_existing_container.exists | default(false)
    - vane_existing_container.container.HostConfig.RestartPolicy.Name != restart_policy

- name: Print Vane deployment state
  ansible.builtin.debug:
    msg: >-
      Vane is {{ 'enabled' if vane_enabled | bool else 'parked (stopped, restart disabled, data retained)' }}.
      See roles/vane/README.md for the DNS and Komodo re-enable procedure.
