---
# Gatus product stack

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/config"
    - "{{ config_base }}/data"
    - "{{ config_base }}/env"
    - "{{ config_base }}/relay"

- name: Deploy environment file
  ansible.builtin.template:
    src: env/gatus.env.j2
    dest: "{{ config_base }}/env/gatus.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: gatus_deploy_environment_file

# The relay script is versioned in the repository and mounted read-only into
# the pinned Python image; a script change recreates the relay container.
- name: Deploy alert relay script
  ansible.builtin.copy:
    src: relay.py
    dest: "{{ config_base }}/relay/relay.py"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: gatus_deploy_relay_script

# Secrets stay out of these files: they carry ${VAR} placeholders that Gatus
# substitutes from the environment at load, so they are readable config.
- name: Deploy Gatus config
  ansible.builtin.template:
    src: "config/{{ item }}.j2"
    dest: "{{ config_base }}/config/{{ item }}"
    owner: "{{ ansible_user }}"
    mode: '0644'
  loop:
    - config.yaml
    - endpoints.yaml
  register: gatus_deploy_gatus_config

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (gatus_deploy_environment_file.changed | default(false)) or
         (gatus_deploy_gatus_config.changed | default(false)) or
         (gatus_deploy_relay_script.changed | default(false))
         else 'auto' }}
  register: compose_result
