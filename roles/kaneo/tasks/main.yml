---
- name: Validate Kaneo Vault configuration
  ansible.builtin.assert:
    that:
      - (kaneo_db_password | default('') | length) > 0
      - (kaneo_redis_password | default('') | length) >= 32
      - (kaneo_redis_password | default('')) is match('^[A-Fa-f0-9]+$')
      - (kaneo_auth_secret | default('') | length) >= 32
      - (kaneo_scm_secret_encryption_key | default('') | length) >= 32
      - (kaneo_oidc_client_id | default('') | string | length) > 0
      - (kaneo_oidc_client_secret | default('') | length) > 0
      - (kaneo_gitlab_oauth_client_id | default('') | string | length) > 0
      - (kaneo_gitlab_oauth_client_secret | default('') | length) > 0
      - (kaneo_registry_username | default('') | length) > 0
      - (kaneo_registry_password | default('') | length) > 0
      - (kaneo_smtp_user | default('') | length) > 0
      - (kaneo_smtp_password | default('') | length) > 0
      - (kaneo_smtp_from | default('') | length) > 0
      - (kaneo_github_app_id | default('') | string | length) > 0
      - (kaneo_github_app_name | default('') | length) > 0
      - (kaneo_github_webhook_secret | default('') | length) > 0
      - (kaneo_github_private_key_base64 | default('') | length) > 0
      - (kaneo_garage_rpc_secret | default('') | length) > 0
      - (kaneo_garage_admin_token | default('') | length) > 0
      - (kaneo_garage_metrics_token | default('') | length) > 0
    fail_msg: >-
      Kaneo requires database, Redis, auth, PocketID, GitHub App, GitLab OAuth,
      SCM encryption, registry, Garage server tokens, and shared SendGrid
      values documented in roles/kaneo/README.md. The Garage access key pair
      is deliberately not asserted: garage_bootstrap.sh generates it after the
      first deploy.
  no_log: true
  tags:
    - preflight

- name: Create Kaneo stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/config"
    - "{{ config_base }}/config/garage"
    - "{{ config_base }}/env"

- name: Deploy Kaneo Garage config
  ansible.builtin.template:
    src: config/garage/garage.toml.j2
    dest: "{{ config_base }}/config/garage/garage.toml"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  notify: Restart Kaneo stack

- name: Deploy Kaneo compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart Kaneo stack

- name: Deploy Kaneo environment files
  ansible.builtin.template:
    src: "env/{{ item }}.env.j2"
    dest: "{{ config_base }}/env/{{ item }}.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - kaneo
    - postgres
    - redis
    - garage
  no_log: true
  notify: Restart Kaneo stack

- name: Deploy Redis entrypoint
  ansible.builtin.template:
    src: redis-entrypoint.sh.j2
    dest: "{{ config_base }}/config/redis-entrypoint.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'
  notify: Restart Kaneo stack

# Staged to the host so the one-time bootstrap (layout + bucket + key) can be
# run over SSH without a repo checkout. See files/garage_bootstrap.sh.
- name: Stage Garage bootstrap script
  ansible.builtin.copy:
    src: garage_bootstrap.sh
    dest: "{{ config_base }}/garage_bootstrap.sh"
    owner: "{{ ansible_user }}"
    mode: '0750'

- name: Authenticate with Kaneo image registry
  community.docker.docker_login:
    registry_url: "{{ kaneo_registry_url }}"
    username: "{{ kaneo_registry_username }}"
    password: "{{ kaneo_registry_password }}"
  no_log: true

# Object blocks live on the Files NAS share; the metadata volume stays local.
# Mirrors roles/kizuna, minus its migration block: Kaneo's Garage has never
# run, so there is no pre-existing local data volume to copy from. The seed
# volume mounts the share root only so the per-stack subdirectory can be
# created before the dedicated volume points at it.
- name: Prepare NAS-backed Garage object storage
  when: kaneo_garage_data_nas_enabled
  block:
    - name: Create Files-root NFS bootstrap volume
      community.docker.docker_volume:
        name: "{{ kaneo_garage_data_nas_seed_volume }}"
        driver: local
        driver_options:
          type: nfs
          o: "{{ kaneo_garage_data_nfs_options }}"
          device: "{{ kaneo_garage_data_nfs_root_device }}"
        state: present

    - name: Create Kaneo Garage data directory on the NAS
      community.docker.docker_container:
        name: kaneo-garage-nas-init
        image: "{{ kaneo_storage_init_image }}"
        command:
          - mkdir
          - -p
          - "/nas/{{ kaneo_garage_data_nas_subdirectory }}"
        volumes:
          - "{{ kaneo_garage_data_nas_seed_volume }}:/nas"
        network_mode: none
        detach: false
        cleanup: true
        state: started
      changed_when: false

    - name: Create dedicated Kaneo Garage NFS volume
      community.docker.docker_volume:
        name: "{{ kaneo_garage_data_volume_name }}"
        driver: local
        driver_options:
          type: nfs
          o: "{{ kaneo_garage_data_nfs_options }}"
          device: "{{ kaneo_garage_data_nfs_device }}"
        state: present

- name: Deploy Kaneo stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: kaneo_compose_result

# Apply storage access before first uploads so a Garage failure during the
# one-time bootstrap cannot leave browser uploads silently broken. The
# one-time garage_bootstrap.sh handles layout + bucket + key creation (the key
# secret has to be captured into the Vault by a human). Its two idempotent,
# declarative steps — granting the key access and setting CORS — are wired here
# so every deploy self-heals them. Gated on the Vault key being present, so a
# pre-bootstrap host skips cleanly.
- name: Ensure Kaneo Garage bucket access + CORS
  when: kaneo_garage_access_key_id | length > 0
  block:
    - name: Check the Kaneo Garage bucket exists
      command: docker exec kaneo-garage /garage bucket info {{ kaneo_garage_bucket }}
      register: kaneo_garage_bucket_info
      changed_when: false
      failed_when: false

    - name: Grant the Kaneo API key read+write+owner on the bucket
      command: >-
        docker exec kaneo-garage /garage bucket allow
        --read --write --owner {{ kaneo_garage_bucket }}
        --key {{ kaneo_garage_access_key_id }}
      changed_when: false
      when: kaneo_garage_bucket_info.rc == 0

    # Garage v2.3.0's CLI has no `bucket set-cors`; CORS is an S3-API config
    # (PutBucketCors). Set it through aws-cli so the browser's cross-origin
    # presigned PUT uploads to the public S3_ENDPOINT route are allowed.
    # Runs as a one-shot aws-cli container on the shared backend network
    # (verified by the pull-policy short-circuit), so it depends neither on the
    # private Kaneo image's internals nor on a host aws-cli. Garage 2.3.0
    # compares allowed header names case-sensitively even though browsers
    # serialize CORS preflight header names in lowercase. Idempotent.
    - name: Allow the Kaneo origin to upload via CORS (S3 PutBucketCors)
      community.docker.docker_container:
        name: kaneo-cors-set
        image: amazon/aws-cli:latest
        networks:
          - name: "{{ backend_network }}"
        networks_cli_compatible: true
        state: started
        detach: false
        cleanup: true
        command:
          - s3api
          - put-bucket-cors
          - --bucket
          - "{{ kaneo_garage_bucket }}"
          - --endpoint-url
          - "http://kaneo-garage:3900"
          - --region
          - "{{ kaneo_garage_region }}"
          - --cors-configuration
          - >-
            {"CORSRules":[{"AllowedOrigins":["{{ kaneo_client_url }}"],
            "AllowedMethods":["GET","PUT","POST","DELETE"],
            "AllowedHeaders":["content-type"],
            "ExposeHeaders":["ETag","Accept-Ranges","Content-Range"]}]}
        env:
          AWS_ACCESS_KEY_ID: "{{ kaneo_garage_access_key_id }}"
          AWS_SECRET_ACCESS_KEY: "{{ kaneo_garage_secret_access_key }}"
      changed_when: false
      no_log: true
      when: kaneo_garage_bucket_info.rc == 0
