---
# Stack identity
stack_name: kaneo
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Kaneo application, built from the private fork by GitLab CI.
#
# Tracks `latest`, matching album-sort, kizuna, kibble and vane. This used to
# pin an immutable full SHA, but only because the fork's CI published nothing
# else: that meant hand-editing this file after every build, and it forced an
# exclusion in the registry cleanup policy so tag expiry could not delete the
# one tag the deploy depended on. CI now publishes `latest` alongside the SHA.
#
# The SHA tags are still published, so pinning one here remains the way to
# roll back to, or hold on, a specific build.
#
# Note that Kaneo runs its Drizzle migrations at API startup, so deploying a
# newer image applies whatever schema changes it carries. That is the tradeoff
# of a floating tag here; deploys are deliberate, so the exposure is bounded.
kaneo_image: registry.atelier.house/jedmund/kaneo
kaneo_image_tag: latest
kaneo_registry_url: https://registry.atelier.house
kaneo_registry_username: "{{ vault_kaneo_registry_username | default('') }}"
kaneo_registry_password: "{{ vault_kaneo_registry_password | default('') }}"
kaneo_domain: kaneo.atelier.house
kaneo_client_url: "https://{{ kaneo_domain }}"
kaneo_api_url: "{{ kaneo_client_url }}/api"
kaneo_port: 5173

# PostgreSQL
kaneo_db_image: postgres:16-alpine
kaneo_db_host: kaneo-postgres
kaneo_db_port: "5432"
kaneo_db_name: kaneo
kaneo_db_user: kaneo
kaneo_db_password: "{{ vault_kaneo_db_password | default('') }}"

# Redis is used for Kaneo's WebSocket Pub/Sub adapter. It is intentionally
# non-durable; PostgreSQL remains the source of truth.
kaneo_redis_image: redis:7-alpine
kaneo_redis_host: kaneo-redis
kaneo_redis_port: "6379"
kaneo_redis_url: "redis://:{{ kaneo_redis_password }}@{{ kaneo_redis_host }}:{{ kaneo_redis_port }}"
kaneo_redis_password: "{{ vault_kaneo_redis_password | default('') }}"

# PocketID custom OIDC provider
kaneo_oidc_authorization_url: https://id.atelier.house/authorize
kaneo_oidc_token_url: https://id.atelier.house/api/oidc/token
kaneo_oidc_user_info_url: https://id.atelier.house/api/oidc/userinfo
kaneo_oidc_discovery_url: https://id.atelier.house/.well-known/openid-configuration
kaneo_oidc_logout_url: https://id.atelier.house/api/oidc/logout
kaneo_oidc_scopes: openid,profile,email
kaneo_oidc_response_type: code
kaneo_oidc_pkce: "true"
kaneo_oidc_client_id: "{{ vault_kaneo_oidc_client_id | default('') }}"
kaneo_oidc_client_secret: "{{ vault_kaneo_oidc_client_secret | default('') }}"
kaneo_auth_secret: "{{ vault_kaneo_auth_secret | default('') }}"

# GitLab repository integration. Browser redirects and webhook URLs use the
# public origin; Kaneo reaches the colocated GitLab container over the shared
# backend network. The application only permits this internal origin when it
# is paired with the server-configured public origin.
kaneo_gitlab_public_url: https://git.atelier.house
kaneo_gitlab_internal_url: http://gitlab
kaneo_gitlab_oauth_client_id: "{{ vault_kaneo_gitlab_oauth_client_id | default('') }}"
kaneo_gitlab_oauth_client_secret: "{{ vault_kaneo_gitlab_oauth_client_secret | default('') }}"
kaneo_scm_secret_encryption_key: "{{ vault_kaneo_scm_secret_encryption_key | default('') }}"

# PocketID-only access. PocketID controls who can authenticate; any permitted
# PocketID user may create a Kaneo account on first sign-in.
kaneo_disable_guest_access: "true"
kaneo_disable_registration: "false"
kaneo_disable_password_registration: "true"
kaneo_disable_login_form: "true"
kaneo_custom_oauth_auto_login: "true"

# SendGrid SMTP via the shared compute_servers Vault key.
kaneo_smtp_host: smtp.sendgrid.net
kaneo_smtp_port: "587"
kaneo_smtp_secure: "false"
kaneo_smtp_require_tls: "true"
kaneo_smtp_ignore_tls: "false"
kaneo_smtp_user: apikey
kaneo_smtp_password: "{{ sendgrid_api_key | default('') }}"
kaneo_smtp_from: "noreply@atelier.house"

# GitHub App repository integration (not GitHub SSO).
kaneo_github_app_id: "{{ vault_kaneo_github_app_id | default('') }}"
kaneo_github_app_name: "{{ vault_kaneo_github_app_name | default('') }}"
kaneo_github_webhook_secret: "{{ vault_kaneo_github_webhook_secret | default('') }}"
kaneo_github_private_key_base64: "{{ vault_kaneo_github_private_key_base64 | default('') }}"

# Garage S3 object storage for private image/attachment uploads.
#
# Mirrors roles/kizuna; the bucket and credentials are created by
# roles/kaneo/files/garage_bootstrap.sh on first deploy (or imported from the
# Vault if generated offline), mirroring the Kizuna first-run flow.
#
# Unlike Kizuna, Kaneo exposes a single S3 endpoint (S3_ENDPOINT) and the
# browser uploads files directly to it via presigned URLs. That endpoint must
# therefore be browser-reachable, so it is the public Traefik route
# (kaneo_garage_domain) rather than the internal kaneo-garage:3900 hostname.
# Requests from the API container to that origin round-trip through Traefik,
# which is the setup the official Kaneo docs recommend for production.
kaneo_garage_image: dxflrs/garage:v2.3.0
kaneo_garage_bucket: kaneo-uploads
kaneo_garage_domain: files.kaneo.atelier.house
kaneo_garage_public_endpoint: "https://{{ kaneo_garage_domain }}"
kaneo_garage_region: garage
kaneo_garage_rpc_secret: "{{ vault_kaneo_garage_rpc_secret | default('') }}"
kaneo_garage_admin_token: "{{ vault_kaneo_garage_admin_token | default('') }}"
kaneo_garage_metrics_token: "{{ vault_kaneo_garage_metrics_token | default('') }}"
kaneo_garage_access_key_id: "{{ vault_kaneo_garage_access_key_id | default('') }}"
kaneo_garage_secret_access_key: "{{ vault_kaneo_garage_secret_access_key | default('') }}"

# Garage keeps its small SQLite metadata volume on the NUC, while the object
# blocks live on the Files NAS share. Same split as roles/kizuna: uploaded
# attachments grow without bound and do not belong on the NUC's root
# filesystem, while the metadata volume stays local so Borg can capture it
# with a consistent snapshot. Set false to fall back to a Compose-managed
# local volume.
#
# There is no migration block here (unlike kizuna): Kaneo's Garage has never
# run, so there is no pre-existing local data volume to copy from.
kaneo_garage_data_nas_enabled: true
kaneo_garage_data_nas_share: Files
kaneo_garage_data_nas_seed_volume: kaneo-files-nas-root
kaneo_garage_data_nas_subdirectory: Kaneo/Garage
kaneo_garage_data_nfs_root_device: ":{{ nfs_base_path }}/{{ kaneo_garage_data_nas_share }}/.data"
kaneo_garage_data_nfs_device: "{{ kaneo_garage_data_nfs_root_device }}/{{ kaneo_garage_data_nas_subdirectory }}"
kaneo_garage_data_nfs_options: "{{ nfs_base_opts }}"
kaneo_garage_data_volume_name: kaneo-garage-data-nas
kaneo_storage_init_image: alpine:3.20

# Dedicated manual inspections are opt-in per instance and project.
kaneo_agent_inspections_enabled: false
kaneo_agent_service_encryption_key: "{{ vault_kaneo_agent_service_encryption_key | default('') }}"
kaneo_agent_service_allowed_origins: http://adapter:1338
