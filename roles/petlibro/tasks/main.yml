---
# Petlibro stack: catbro-server (Rust + embedded go2rtc) replaces Petlibro's
# cloud entirely. Feeders DNS-redirected to this host's MQTT broker; their
# video streams emerge as RTSP for Home Assistant to consume.
#
# Manual prerequisites (see roles/petlibro/README.md):
#   - DNS rewrite for mqtt.us.petlibro.com -> this host (UDM/AdGuard)
#   - Power-cycle feeders after first deploy so they re-resolve DNS

- name: Create {{ stack_name }} base directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/config"
    - "{{ config_base }}/config/mosquitto"
    - "{{ config_base }}/data/mosquitto"

# Catbro-specific directories — only need to exist when the catbro
# service is actually being deployed.  Skipping these when disabled
# avoids cloning a ~30MB git repo + leaving a stale build dir around.
- name: Create catbro source + data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}/data/catbro"
    - "{{ config_base }}/src"
  when: petlibro_catbro_enabled | default(false)

- name: Clone catbro-server source
  ansible.builtin.git:
    repo: "{{ catbro_repo_url }}"
    dest: "{{ config_base }}/src"
    version: "{{ catbro_repo_ref }}"
    force: true        # discard local changes; this is a build dir
    recursive: true    # embedded go2rtc may use submodules
  register: catbro_git
  when: petlibro_catbro_enabled | default(false)

- name: Deploy Dockerfile
  template:
    src: Dockerfile.catbro.j2
    dest: "{{ config_base }}/Dockerfile.catbro"
    owner: "{{ ansible_user }}"
    mode: '0644'
  when: petlibro_catbro_enabled | default(false)

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy mosquitto config
  template:
    src: config/mosquitto.conf.j2
    dest: "{{ config_base }}/config/mosquitto/mosquitto.conf"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: petlibro_deploy_mosquitto_config

- name: Deploy catbro creds.toml
  template:
    src: config/creds.toml.j2
    dest: "{{ config_base }}/data/catbro/creds.toml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  when: petlibro_catbro_enabled | default(false)
  register: petlibro_deploy_catbro_creds_toml

- name: Deploy go2rtc config
  template:
    src: config/go2rtc.yaml.j2
    dest: "{{ config_base }}/data/catbro/go2rtc.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  when: petlibro_catbro_enabled | default(false)
  register: petlibro_deploy_go2rtc_config

# ---------------------------------------------------------------------------
# kalay-mock — RETIRED.  kibble runs Kalay in-process (internal/kalay)
# and owns UDP 10001/10240 now; the scripts live on in the petlibro app
# repo (feeder-re/mock-kalay).  These tasks scrub the legacy host-level
# unit from hosts that still have it; drop the block once it has run
# against every host.
# ---------------------------------------------------------------------------
- name: Check whether the legacy kalay-mock unit is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/kalay-mock.service
  register: petlibro_kalay_mock_unit

- name: Stop + disable the legacy kalay-mock unit (retired; kibble owns Kalay)
  ansible.builtin.systemd:
    name: kalay-mock.service
    state: stopped
    enabled: false
  become: true
  when: petlibro_kalay_mock_unit.stat.exists

- name: Remove the legacy kalay-mock unit file
  ansible.builtin.file:
    path: /etc/systemd/system/kalay-mock.service
    state: absent
  become: true
  when: petlibro_kalay_mock_unit.stat.exists
  notify: Reload systemd

- name: Remove the legacy kalay-mock install dir
  ansible.builtin.file:
    path: /opt/kalay-mock
    state: absent
  become: true

- name: Inspect petlibro build requirements
  ansible.builtin.import_tasks: build.yml
  when: petlibro_catbro_enabled | default(false) | bool

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    # Explicitly override service build policies to avoid no-op rebuilds.
    build: >-
      {{ 'always' if (petlibro_catbro_enabled | default(false) | bool)
         and (petlibro_build_required | default(true)) else 'never' }}
    pull: policy
    remove_orphans: true
    recreate: >-
      {{ 'always' if
         (petlibro_deploy_mosquitto_config.changed | default(false)) or
         (petlibro_deploy_catbro_creds_toml.changed | default(false)) or
         (petlibro_deploy_go2rtc_config.changed | default(false))
         else 'auto' }}
  register: compose_result

- name: Record successful petlibro build inputs
  ansible.builtin.copy:
    content: "{{ {'fingerprint': petlibro_build_fingerprint} | to_json }}\n"
    dest: "{{ config_base }}/.ansible-build-inputs.json"
    owner: "{{ ansible_user }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - petlibro_catbro_enabled | default(false) | bool
    - petlibro_build_services | default([]) | length > 0
