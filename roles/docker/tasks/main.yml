---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-debian
    state: present

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Get architecture
  command: dpkg --print-architecture
  register: arch_output
  changed_when: false

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ arch_output.stdout }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_repository

- name: Remove legacy Docker repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.gpg

- name: Update apt cache for Docker repository
  ansible.builtin.apt:
    update_cache: true
  when: docker_repository is changed

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - python3-docker
    state: present
  notify: Restart docker

- name: Ensure docker group exists
  group:
    name: docker
    state: present

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Configure Docker daemon
  copy:
    content: |
      {
        "dns": {{ docker_dns_servers | to_json }},
        "builder": {
          "gc": {
            "enabled": true,
            "defaultKeepStorage": "{{ docker_builder_gc_keep_storage }}",
            "policy": [
              { "keepStorage": "{{ docker_builder_gc_prune_storage }}", "filter": ["unused-for={{ docker_builder_gc_unused_for }}"] },
              { "keepStorage": "{{ docker_builder_gc_keep_storage }}", "all": true }
            ]
          }
        }
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

- name: Install nas-reachable.service
  template:
    src: nas-reachable.service.j2
    dest: /etc/systemd/system/nas-reachable.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart docker

- name: Create docker.service.d drop-in directory
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install docker wait-for-nas drop-in
  template:
    src: docker-wait-for-nas.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-wait-for-nas.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart docker

- name: Enable nas-reachable.service
  systemd:
    name: nas-reachable
    enabled: true
    daemon_reload: true

- name: Install docker-stacks-up.service
  template:
    src: docker-stacks-up.service.j2
    dest: /etc/systemd/system/docker-stacks-up.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Enable docker-stacks-up.service
  systemd:
    name: docker-stacks-up
    enabled: true
    daemon_reload: true

- name: Enable Docker is running
  service:
    name: docker
    state: started
    enabled: true

- name: Schedule weekly Docker prune
  ansible.builtin.cron:
    name: docker-prune
    user: root
    job: >-
      docker ps -aq --filter exited=0 | xargs -r docker rm >> /var/log/docker-prune.log 2>&1 &&
      docker image prune -f >> /var/log/docker-prune.log 2>&1 &&
      docker volume prune -f >> /var/log/docker-prune.log 2>&1
    weekday: "{{ docker_prune_cron_weekday }}"
    hour: "{{ docker_prune_cron_hour }}"
    minute: "{{ docker_prune_cron_minute }}"
