---
# slskd product stack

- name: Validate slskd API key configuration
  ansible.builtin.assert:
    that:
      - slskd_api_key | length == 0 or (slskd_api_key | length >= 16 and slskd_api_key | length <= 255)
      - "';' not in slskd_api_key"
      - slskd_api_key_role in ['ReadOnly', 'ReadWrite', 'Administrator']
      - slskd_api_key_cidr | length > 0
      - "';' not in slskd_api_key_cidr"
    fail_msg: >-
      vault_slskd_api_key in group_vars/slskd/vault.yml must be empty or
      16 to 255 characters without semicolons. slskd_api_key_role must be
      ReadOnly, ReadWrite or Administrator.
  tags:
    - preflight

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ docker_base_path }}/{{ stack_name }}"
    - "{{ docker_base_path }}/{{ stack_name }}/env"
    - "{{ docker_base_path }}/{{ stack_name }}/config"

- name: Create slskd download directories in downloads volume
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - downloads:/downloads
      - alpine:3.20
      - sh
      - -c
      - mkdir -p /downloads/music /downloads/music/.incomplete
  changed_when: false

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy slskd configuration file
  ansible.builtin.template:
    src: slskd.yml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/config/slskd.yml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  register: slskd_deploy_slskd_configuration_file

- name: Deploy environment file
  ansible.builtin.template:
    src: env/slskd.env.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/slskd.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  register: slskd_deploy_environment_file

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (slskd_deploy_slskd_configuration_file.changed | default(false)) or
         (slskd_deploy_environment_file.changed | default(false))
         else 'auto' }}
  register: compose_result
