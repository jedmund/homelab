---
- name: Install Netdata (Debian/Ubuntu)
  when: ansible_facts['os_family'] == 'Debian'
  become: true
  block:
    - name: Check if Netdata is already installed
      stat:
        path: /usr/sbin/netdata
      register: netdata_binary

    - name: Download Netdata kickstart script
      get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: "0755"
      when: not netdata_binary.stat.exists

    - name: Run Netdata kickstart installer
      command: >
        /tmp/netdata-kickstart.sh
        --non-interactive
        --stable-channel
        --disable-telemetry
      when: not netdata_binary.stat.exists

    - name: Ensure Netdata service is enabled and running
      systemd:
        name: netdata
        enabled: true
        state: started

    - name: Create Netdata systemd drop-in directory
      file:
        path: /etc/systemd/system/netdata.service.d
        state: directory
        mode: "0755"

    - name: Extend Netdata systemd start/stop timeouts
      copy:
        content: |
          [Service]
          TimeoutStartSec=600
          TimeoutStopSec=120
        dest: /etc/systemd/system/netdata.service.d/timeout.conf
        mode: "0644"
      register: netdata_timeout_override
      notify: restart netdata

    - name: Reload systemd after drop-in change
      systemd:
        daemon_reload: true
      when: netdata_timeout_override.changed

- name: Install Netdata (macOS)
  when: ansible_facts['os_family'] == 'Darwin'
  become: false
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] | default('/usr/bin:/bin:/usr/sbin:/sbin') }}"
  block:
    - name: Check if Netdata is installed via Homebrew
      command: brew list netdata
      register: brew_netdata_check
      failed_when: false
      changed_when: false

    - name: Install Netdata via Homebrew
      command: brew install netdata
      when: brew_netdata_check.rc != 0

    # `brew services list` is not a reliable probe here: it is currently
    # broken on mac-mini with "undefined method 'stop_timeout'", so it returns
    # nothing and the start below always ran. Starting an already-bootstrapped
    # launchd agent then fails with "Input/output error". Ask launchctl
    # instead; it exits 0 when the label is loaded and 113 when it is not.
    - name: Check whether the Netdata agent is loaded
      command: launchctl list {{ netdata_launchd_label }}
      register: netdata_agent
      changed_when: false
      failed_when: false

    - name: Start Netdata via brew services
      command: brew services start netdata
      when: netdata_agent.rc != 0
      changed_when: true

- name: Rotate Netdata's own logs on macOS
  when: ansible_facts['os_family'] == 'Darwin'
  become: false
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] | default('/usr/bin:/bin:/usr/sbin:/sbin') }}"
  block:
    - name: Install logrotate via Homebrew
      community.general.homebrew:
        name: logrotate
        state: present

    - name: Ensure the logrotate config directory exists
      ansible.builtin.file:
        path: "{{ netdata_logrotate_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy Netdata logrotate config
      ansible.builtin.template:
        src: logrotate-netdata.conf.j2
        dest: "{{ netdata_logrotate_dir }}/netdata"
        mode: '0644'

    # Starting an already-bootstrapped launchd agent fails with "Input/output
    # error", so guard on the label the way the Netdata start above does.
    - name: Check whether the logrotate agent is loaded
      ansible.builtin.command: launchctl list {{ netdata_logrotate_label }}
      register: netdata_logrotate_agent
      changed_when: false
      failed_when: false

    - name: Ensure the logrotate service is running
      ansible.builtin.command: brew services start logrotate
      when: netdata_logrotate_agent.rc != 0
      changed_when: true

- name: Set Netdata config directory
  set_fact:
    netdata_config_dir: "{{ netdata_config_dir_linux if ansible_facts['os_family'] == 'Debian' else netdata_config_dir_darwin }}"

- name: Configure Netdata streaming
  template:
    src: stream.conf.j2
    dest: "{{ netdata_config_dir }}/stream.conf"
    owner: "{{ 'root' if ansible_facts['os_family'] == 'Debian' else ansible_user }}"
    group: "{{ 'netdata' if ansible_facts['os_family'] == 'Debian' else omit }}"
    mode: "{{ '0640' if ansible_facts['os_family'] == 'Debian' else '0600' }}"
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"
  no_log: true
  notify: restart netdata

# The parent needs its retention tiers; macOS hosts need the log level. Linux
# children are deliberately left alone so their packaged netdata.conf stands.
- name: Configure Netdata
  template:
    src: netdata.conf.j2
    dest: "{{ netdata_config_dir }}/netdata.conf"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"
  when: netdata_role == 'parent' or ansible_facts['os_family'] == 'Darwin'
  notify: restart netdata
