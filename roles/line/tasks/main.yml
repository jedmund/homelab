---
# Line - personal dashboard at atelier.house, built from source

# --- One-time migration off the infra-gateway stack -----------------------
# Line used to be one service inside the infra-gateway compose project. The
# data volume moves to this role's own stack directory, and the container
# has to be released from the old project before the new one can claim the
# `line` container_name. Both tasks are no-ops once the move has happened,
# and this block can be deleted after every host has run the role.

- name: Check for Line data under the legacy infra-gateway stack
  stat:
    path: "{{ line_legacy_base }}/config/line/data"
  register: line_legacy_data

- name: Check for Line data under the {{ stack_name }} stack
  stat:
    path: "{{ config_base }}/config/line/data"
  register: line_current_data

- name: Remove Line container from the legacy infra-gateway project
  community.docker.docker_container:
    name: line
    state: absent
  when:
    - line_legacy_data.stat.exists
    - not line_current_data.stat.exists

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/config/line"
    - "{{ config_base }}/source"

- name: Move Line data out of the legacy infra-gateway stack
  command: mv {{ line_legacy_base }}/config/line/data {{ config_base }}/config/line/data
  args:
    creates: "{{ config_base }}/config/line/data"
  when:
    - line_legacy_data.stat.exists
    - not line_current_data.stat.exists

- name: Create Line data directory
  file:
    path: "{{ config_base }}/config/line/data"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

# --- Normal deploy --------------------------------------------------------

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment files
  template:
    src: "env/{{ item }}.env.j2"
    dest: "{{ config_base }}/env/{{ item }}.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - line
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Pull latest line source
  ansible.builtin.git:
    repo: "{{ line_repo }}"
    dest: "{{ line_source_path }}"
    version: "{{ line_version }}"
    force: true
    accept_hostkey: true
  become: false
  register: line_git
  notify: Restart {{ stack_name }} stack

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    # Rebuild only when the line source moved; `policy` still builds the
    # image when it's missing.
    build: "{{ 'always' if line_git.changed else 'policy' }}"
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result
