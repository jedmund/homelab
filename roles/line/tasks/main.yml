---
# Line - personal dashboard at atelier.house, built from source

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/env"
    - "{{ config_base }}/config/line"
    - "{{ config_base }}/source"

- name: Create Line data directory
  file:
    path: "{{ config_base }}/config/line/data"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy environment files
  template:
    src: "env/{{ item }}.env.j2"
    dest: "{{ config_base }}/env/{{ item }}.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - line
  no_log: true
  register: line_deploy_environment_files

- name: Pull latest line source
  ansible.builtin.git:
    repo: "{{ line_repo }}"
    dest: "{{ line_source_path }}"
    version: "{{ line_version }}"
    force: true
    accept_hostkey: true
  become: false
  register: line_git

- name: Inspect line build requirements
  ansible.builtin.import_tasks: build.yml

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    # Explicitly override service build policies to avoid no-op rebuilds.
    build: "{{ 'always' if (line_build_required | default(true)) else 'never' }}"
    pull: policy
    remove_orphans: true
    recreate: >-
      {{ 'always' if
         (line_deploy_environment_files.changed | default(false))
         else 'auto' }}
  register: compose_result

- name: Record successful line build inputs
  ansible.builtin.copy:
    content: "{{ {'fingerprint': line_build_fingerprint} | to_json }}\n"
    dest: "{{ config_base }}/.ansible-build-inputs.json"
    owner: "{{ ansible_user }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - line_build_services | default([]) | length > 0
