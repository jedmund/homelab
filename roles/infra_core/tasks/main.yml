---
# Infra Core Stack - MongoDB + Komodo
# Uses docker_compose_v2 for container orchestration

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ docker_base_path }}/{{ stack_name }}"
      mode: '0755'
    - path: "{{ docker_base_path }}/{{ stack_name }}/env"
      mode: '0700'
    - path: "{{ docker_base_path }}/{{ stack_name }}/backups"
      mode: '0755'
    - path: "{{ periphery_root_directory }}"
      mode: '0755'
  loop_control:
    label: "{{ item.path }}"

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ docker_base_path }}/{{ stack_name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart {{ stack_name }} stack

- name: Deploy environment files
  template:
    src: "env/{{ item }}.env.j2"
    dest: "{{ docker_base_path }}/{{ stack_name }}/env/{{ item }}.env"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - komodo
    - mongo
  no_log: true
  notify: Restart {{ stack_name }} stack

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ stack_name }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result
