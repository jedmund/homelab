---
- name: Reload kdump
  ansible.builtin.command: kdump-config reload
  changed_when: true
  when: crash_capture_kexec_crash_size | default(0) | int > 0

- name: Re-execute systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart netconsole
  ansible.builtin.systemd_service:
    name: netconsole
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and crash_capture_netconsole_unit is changed)

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
