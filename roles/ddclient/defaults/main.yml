---
# Stack identity
stack_name: ddclient
config_base: "{{ docker_base_path }}/{{ stack_name }}"

ddclient_image: linuxserver/ddclient:latest # floating, tracks upstream

# DDClient settings
ddclient_daemon_interval: "300"
ddclient_ssl: "yes"
ddclient_use: "web"
ddclient_protocol: "cloudflare"
ddclient_atelier_zone: "atelier.house"
ddclient_atelier_subdomains:
  - atelier.house
  - ai.atelier.house
  - aurral.atelier.house
  - auth.atelier.house
