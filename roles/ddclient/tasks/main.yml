---
# ddclient - dynamic DNS for the atelier.house and fireplace.cafe zones

- name: Create {{ stack_name }} directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/config/ddclient"

- name: Deploy compose file
  template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy DDClient config
  template:
    src: ddclient/ddclient.conf.j2
    dest: "{{ config_base }}/config/ddclient/ddclient.conf"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: '0600'
  no_log: true
  register: ddclient_deploy_ddclient_config

# ddclient with protocol=cloudflare can update existing A records but
# cannot create them. Adding a new entry to ddclient_atelier_subdomains
# is silently ignored on Cloudflare until somebody clicks through the
# dashboard to stub the record. This task bootstraps any missing record
# with the current WAN IP so ddclient can take over maintenance on the
# next tick. solo: true keeps it idempotent; ddclient will overwrite
# the value on its own schedule if the IP changes.
- name: Detect current WAN IP for Cloudflare bootstrap
  ansible.builtin.uri:
    url: https://api.ipify.org?format=json
    return_content: true
  register: _wan_ip_lookup
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Bootstrap missing Cloudflare A records for atelier subdomains
  # ddclient's vault holds the Global API Key + email pair (the cloudflare
  # protocol's legacy auth), so we use the same here. api_token (Bearer)
  # would be cleaner but would require provisioning a new credential.
  community.general.cloudflare_dns:
    account_api_key: "{{ ddclient_cloudflare_api_token }}"
    account_email: "{{ ddclient_cloudflare_email }}"
    zone: "{{ ddclient_atelier_zone }}"
    record: "{{ item if item == ddclient_atelier_zone else item | regex_replace('\\.' ~ ddclient_atelier_zone ~ '$', '') }}"
    type: A
    value: "{{ _wan_ip_lookup.json.ip }}"
    proxied: false
    solo: true
    state: present
  no_log: true
  loop: "{{ ddclient_atelier_subdomains }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Look up the Cloudflare zone for Minecraft SRV records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ ddclient_atelier_zone | urlencode }}"
    headers:
      X-Auth-Email: "{{ ddclient_cloudflare_email }}"
      X-Auth-Key: "{{ ddclient_cloudflare_api_token }}"
    return_content: true
  no_log: true
  register: ddclient_minecraft_srv_zone
  delegate_to: localhost
  become: false
  run_once: true

- name: Read existing Cloudflare Minecraft SRV records
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ ddclient_minecraft_srv_zone.json.result[0].id
      }}/dns_records?type=SRV&name={{ ('_minecraft._tcp.' ~ item) | urlencode }}
    headers:
      X-Auth-Email: "{{ ddclient_cloudflare_email }}"
      X-Auth-Key: "{{ ddclient_cloudflare_api_token }}"
    return_content: true
  no_log: true
  register: ddclient_minecraft_srv_records
  changed_when: false
  loop: "{{ ddclient_minecraft_srv_hosts }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Create or update Cloudflare Minecraft SRV records only when needed
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ ddclient_minecraft_srv_zone.json.result[0].id
      }}/dns_records{{ ('/' ~ srv_records[0].id) if srv_records | length > 0 else '' }}
    method: "{{ 'PUT' if srv_records | length > 0 else 'POST' }}"
    headers:
      X-Auth-Email: "{{ ddclient_cloudflare_email }}"
      X-Auth-Key: "{{ ddclient_cloudflare_api_token }}"
    body_format: json
    body:
      type: SRV
      name: "_minecraft._tcp.{{ ddclient_minecraft_srv_hosts[item] }}"
      data:
        target: "{{ ddclient_minecraft_srv_hosts[item] }}"
        port: "{{ ddclient_minecraft_srv_port }}"
        priority: "{{ ddclient_minecraft_srv_priority }}"
        weight: "{{ ddclient_minecraft_srv_weight }}"
      ttl: 1
    status_code: [200]
    return_content: true
  vars:
    srv_records: "{{ ddclient_minecraft_srv_records.results[item].json.result }}"
  when: >-
    srv_records | length == 0 or
    (srv_records[0].data.target != ddclient_minecraft_srv_hosts[item]) or
    (srv_records[0].data.port | int != ddclient_minecraft_srv_port | int) or
    (srv_records[0].data.priority | int != ddclient_minecraft_srv_priority | int) or
    (srv_records[0].data.weight | int != ddclient_minecraft_srv_weight | int) or
    (srv_records[0].ttl | int != 1)
  no_log: true
  loop: "{{ range(0, ddclient_minecraft_srv_hosts | length) | list }}"
  loop_control:
    label: "{{ ddclient_minecraft_srv_hosts[item] }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: ddclient_minecraft_srv_updates
  changed_when: not ansible_check_mode

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
    recreate: >-
      {{ 'always' if
         (ddclient_deploy_ddclient_config.changed | default(false))
         else 'auto' }}
  register: compose_result
