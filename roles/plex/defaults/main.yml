---
# Stack identity
stack_name: plex
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Plex settings

# Floating tag by design: the scheduled Komodo `update-plex` Action applies new
# images daily at 04:30 America/Los_Angeles (komodo/stacks.toml). To roll back,
# pin this to the previous PMS build and run: make deploy-tags TAGS=plex
plex_image: lscr.io/linuxserver/plex:latest
plex_port: 32400
plex_transcode_path: "{{ config_base }}/transcode"
plex_advertise_ip: "http://{{ ansible_host }}:{{ plex_port }}/"
plex_libva_driver_name: "iHD"
