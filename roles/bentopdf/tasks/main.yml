---
# BentoPDF - browser-side PDF toolkit at pdf.atelier.house
# No native auth, so the route sits behind TinyAuth.

- name: Create {{ stack_name }} directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ config_base }}"
    - "{{ config_base }}/scripts"

- name: Deploy maintenance check
  ansible.builtin.template:
    src: maintenance-check.sh.j2
    dest: "{{ config_base }}/scripts/maintenance-check.sh"
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ config_base }}/compose.yaml"
    owner: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy {{ stack_name }} stack
  community.docker.docker_compose_v2:
    project_src: "{{ config_base }}"
    state: present
    remove_orphans: true
    pull: "{{ docker_pull_policy | default('missing') }}"
  register: compose_result
  when: not (homelab_stage | default(false) | bool)
