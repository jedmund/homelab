---
# Stack identity
stack_name: vllm
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# Karmic Kraken beta, September 20 assembly. Pin the registry digest;
# the short channel tag moves independently of this deployment.
vllm_image: ghcr.io/local-inference-lab/vllm@sha256:60dc178fe69015eb289db12b6183b8d6aec75613e0c659ce7e1f9ba05e8bbed1
vllm_default_shm_size: "32gb"

# Preserve the existing model download and broad cache mounts. The image
# puts its runtime/compiler cache in the separate /cache mount below.
vllm_cache_root: "/home/{{ ansible_user }}/.cache/deepseek"
vllm_hf_cache_dir: "/home/{{ ansible_user }}/.cache/huggingface"
vllm_model_cache_dirs:
  # Keep the prior runtime cache available for rollback.
  - "{{ config_base }}/cache/ds4-v20-r15"
  - "{{ config_base }}/cache/ds4-v20-r15/tmp"
  - "{{ config_base }}/cache/ds4-karmic-22f3f98b"
  - "{{ config_base }}/cache/ds4-karmic-22f3f98b/tmp"
  - "{{ config_base }}/cache/glm53-spark-22f3f98b"
  - "{{ config_base }}/cache/glm53-spark-22f3f98b/tmp"
  - "{{ config_base }}/cache/qwen38-next-22f3f98b"
  - "{{ config_base }}/cache/qwen38-next-22f3f98b/tmp"

# Manual lifecycle: rendering this role does not start a model.
# Start the existing profile explicitly after reviewing its configuration.
vllm_common_env:
  # GPUs 0,1 are the Max-Q pair; the optional Qwen profile uses GPU 2.
  CUDA_DEVICE_ORDER: "PCI_BUS_ID"

vllm_models:
  - name: deepseek-v4-flash-0731
    host_port: 11437
    container_port: 11437
    init: true
    # First K5 startup took about 7.5 minutes while compiling kernels.
    healthcheck_start_period: "10m"
    # Preserve published-port LAN access, host IPC, and GPU visibility.
    privileged: true
    shm_size: "32gb"
    cuda_visible_devices: "0,1"
    extra_volumes:
      - "{{ config_base }}/cache/ds4-karmic-22f3f98b:/cache"
      - "{{ config_base }}/cache/ds4-karmic-22f3f98b/tmp:/container-tmp"
    extra_env:
      PROFILE: ds4-flash
      HARDWARE_PROFILE: rtx-pro-6000-pcie
      TP: "2"
      DCP: "1"
      PORT: "11437"
      SERVED_MODEL_NAME: DeepSeek-V4-Flash
      MAX_NUM_SEQS: "4"
      MAX_MODEL_LEN: "131072"
      # Use the shared profile's budget; 8192 reduced K5 KV headroom.
      MAX_NUM_BATCHED_TOKENS: "4096"
      GPU_MEMORY_UTILIZATION: "0.975"
      CACHE_MODE: vram
      INSTANTTENSOR_BACKEND: BUFFERED
    # Keep the image's unified entrypoint. Native arguments override the
    # model profile; do not reuse the old serve-ds4-flash.sh launcher.
    args:
      - --mode
      - dspark
      - --draft-tokens
      - "5"
      - --revision
      - 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      - --code-revision
      - 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      # Match the old server's default sampling during runtime comparison.
      - --override-generation-config
      - '{"temperature":1.0,"top_p":1.0}'

  # Alternative on the same GPU pair: stop DeepSeek before starting GLM.
  - name: glm-5.3-flash-spark
    host_port: 11438
    container_port: 11438
    init: true
    healthcheck_start_period: "10m"
    privileged: true
    shm_size: "32gb"
    cuda_visible_devices: "0,1"
    extra_volumes:
      - "{{ config_base }}/cache/glm53-spark-22f3f98b:/cache"
      - "{{ config_base }}/cache/glm53-spark-22f3f98b/tmp:/container-tmp"
    extra_env:
      PRESET: glm53-spark-tp2
      PORT: "11438"
      CACHE_MODE: vram
      INSTANTTENSOR_BACKEND: BUFFERED
    # The preset supplies TP2/DCP2, MTP3, four slots and a 3072-token
    # prefill budget. Keep its two-card memory settings together.
    args:
      - --revision
      - a608241037e4c2565356bff7ca293f2133888f88
      - --code-revision
      - a608241037e4c2565356bff7ca293f2133888f88

  # GPU 2 experiment: stop llama-swap before starting this profile.
  # DeepSeek can remain on GPUs 0,1. Preserve room for GPU side services.
  - name: qwen3.8-flash-next
    host_port: 11439
    container_port: 11439
    init: true
    healthcheck_start_period: "10m"
    privileged: true
    shm_size: "32gb"
    cuda_visible_devices: "2"
    extra_volumes:
      - "{{ config_base }}/cache/qwen38-next-22f3f98b:/cache"
      - "{{ config_base }}/cache/qwen38-next-22f3f98b/tmp:/container-tmp"
    extra_env:
      PROFILE: qwen38-flash-next
      HARDWARE_PROFILE: rtx-pro-6000-pcie
      TP: "1"
      DCP: "1"
      PORT: "11439"
      MAX_NUM_SEQS: "4"
      GPU_MEMORY_UTILIZATION: "0.90"
      CACHE_MODE: vram
      INSTANTTENSOR_BACKEND: BUFFERED
    args:
      - --revision
      - 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
      - --code-revision
      - 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
      - --language-model-only
