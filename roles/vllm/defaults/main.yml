---
# Stack identity
stack_name: vllm
config_base: "{{ docker_base_path }}/{{ stack_name }}"

# vLLM is the working DeepSeek V4 Flash slot on max. SGLang's
# matching image (lavd/sglang-d4f-b12x:5-24) trips a huggingface_hub
# strict dataclass validator on the NVFP4 quant's `kv_lora_rank: null`
# config field, which the dsv4 attention backend doesn't actually
# need but the loader still enforces. lavd's vLLM build doesn't go
# through that code path because it loads the FP8 base from HF Hub
# directly, so this is the path that has actually run for days at a
# time on this box.
vllm_image: lavd/vllm:jasl-dsv4-5-21-13.2

# /dev/shm sizing for the vLLM container. Multi-GPU TP and the dsv4
# fused MoE both push intermediate state through tmpfs; 32 GB matches
# the docker run command that we know works.
vllm_default_shm_size: "32gb"

# Reuse the existing on-host caches so the ~235 GB HF Hub download is
# not repeated. Layered exactly the way the working docker run set up:
#   ~/.cache/deepseek      -> /root/.cache         (vllm + flashinfer
#                                                   build artifacts)
#   ~/.cache/huggingface   -> /root/.cache/huggingface (model weights)
# The second mount nests inside the first; docker handles the overlay.
vllm_cache_root: "/home/{{ ansible_user }}/.cache/deepseek"
vllm_hf_cache_dir: "/home/{{ ansible_user }}/.cache/huggingface"

# Per-model scratch/JIT dirs bind-mounted by launcher-style images.
# Created by tasks/main.yml so docker doesn't make them root-owned.
vllm_model_cache_dirs:
  - "{{ config_base }}/cache/ds4-v20-r15"
  - "{{ config_base }}/cache/ds4-v20-r15/tmp"

# Manual lifecycle: each model is a compose service gated behind a
# profile, so `docker compose up` (and the ansible deploy) creates
# nothing by default. Bring a model up:
#   docker compose --profile deepseek-v4-flash up -d
# Stop it to hand VRAM back to llama-swap:
#   docker compose --profile deepseek-v4-flash down

# Env applied to every vLLM container.
#   CUDA_DEVICE_ORDER=PCI_BUS_ID  vLLM warns on this box because the
#     three Pro 6000 cards are heterogeneous (2x Max-Q 300 W + 1x full
#     WS 600 W); CUDA's default order is by performance, which can
#     reshuffle device indices. Pinning to PCI_BUS_ID makes
#     CUDA_VISIBLE_DEVICES=0,1 deterministically mean the Max-Q pair.
vllm_common_env:
  CUDA_DEVICE_ORDER: "PCI_BUS_ID"

vllm_models:
  # DeepSeek V4 Flash via vLLM. This is the configuration the user ran
  # by hand for several days; encoded here verbatim so the compose
  # output matches the known-good docker run command.
  #
  # The model name (first positional arg) is an HF Hub identifier;
  # vLLM downloads weights on first run into the mounted HF cache.
  # Weights are already present at the cache path, so the container
  # only re-validates the snapshot rather than re-downloading.
  - name: deepseek-v4-flash
    host_port: 11437
    container_port: 8000
    shm_size: "32gb"
    cuda_visible_devices: "0,1"
    extra_env:
      HOME: /root
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      TORCH_CUDA_ARCH_LIST: "12.0"
      # Profiler estimator over-counts cuda graph memory on the dsv4
      # build and trips the gpu-memory-utilization guard; disable it
      # to match the working docker run.
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    args:
      - deepseek-ai/DeepSeek-V4-Flash
      - --language-model-only
      - --served-model-name=DeepSeek-V4-Flash
      - --tokenizer-mode=deepseek_v4
      - --tool-call-parser=deepseek_v4
      - --enable-auto-tool-choice
      - --reasoning-parser=deepseek_v4
      - --reasoning-config
      - '{"reasoning_start_str": "<think>", "reasoning_end_str": "</think>"}'
      - --tensor-parallel-size=2
      - --kv-cache-dtype=fp8_ds_mla
      - --gpu-memory-utilization=0.96
      - --max-num-batched-tokens=8192
      - --enable-prefix-caching
      - --max-num-seqs=2
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --default-chat-template-kwargs
      - '{"thinking": true, "reasoning_effort": "high"}'
      - --no-enable-flashinfer-autotune
      - --host=0.0.0.0
      - --port=8000

  # DeepSeek V4 Flash 0731, the official release that supersedes the
  # preview entry above. Served by the voipmonitor gilded-gnosis
  # v20-r15 image from local-inference-lab/blackwell-llm-docker, which
  # is the same SM120 + b12x lineage as the lavd builds we ran before.
  #
  # This image works differently from the lavd one: its ENTRYPOINT is
  # /usr/local/bin/serve-ds4-flash.sh and every serving choice comes
  # from env vars, so there is no `args` list here. Upstream reference
  # config is examples/docker-compose-ds4-v20-r15.yml in that repo.
  #
  # Both this and the preview bind 11437, so only one can run at a
  # time. That is deliberate: it makes an accidental double-start fail
  # loudly instead of silently splitting VRAM.
  - name: deepseek-v4-flash-0731
    image: voipmonitor/vllm:gilded-gnosis-v20-vllm0bc48c5-sieec30ff-fi801d57a-cu132-20260731-r15
    host_port: 11437
    container_port: 11437
    entrypoint: ["/usr/local/bin/serve-ds4-flash.sh"]
    # Upstream runs this host-networked and privileged; the launcher's
    # PCIe calibration pass probes the interconnect directly.
    network_mode: host
    privileged: true
    shm_size: "32gb"
    cuda_visible_devices: "0,1"
    extra_volumes:
      - "{{ config_base }}/cache/ds4-v20-r15:/cache"
      - "{{ config_base }}/cache/ds4-v20-r15/tmp:/container-tmp"
    extra_env:
      # Keep aligned with host_port: host networking means the
      # launcher binds this directly, and the healthcheck uses it.
      PORT: "11437"
      # Pin the OpenAI model id to what the preview already serves, so
      # opencode/pi keep working unchanged and swapping profiles is
      # transparent to clients. This image family honours
      # SERVED_MODEL_NAME (its GLM launchers export it with a default),
      # but serve-ds4-flash.sh sets no default we can read from outside
      # the image: confirm with `curl :11437/v1/models` on first start.
      SERVED_MODEL_NAME: DeepSeek-V4-Flash
      # dspark is the only speculative contract 0731 ships. The
      # standard MTP path (MODE=mtp2/mtp3) silently selects the older
      # preview checkpoint instead, because 0731 does not provide the
      # standard MTP serving contract.
      MODE: dspark
      BACKEND: b12x-a8
      TP_SIZE: "2"
      DCP_SIZE: "1"
      DSPARK_DEPTH_MODE: fixed
      # 5, NOT 7. Both the DeepSeek model card and this image's own
      # compose example default to 7, and 7 produces garbled output
      # (confirmed by several operators on 2x Pro 6000 on release day,
      # most visibly above ~16 concurrent sequences). 5 is safe.
      DSPARK_TOKENS: "5"
      # Upstream defaults this to 16. Starting low until output
      # quality is validated on our box; raise deliberately and
      # re-check output each step. The launcher derives its CUDA graph
      # cap from this value.
      MAX_NUM_SEQS: "4"
      MAX_MODEL_LEN: "131072"
      MAX_NUM_BATCHED_TOKENS: "8192"
      # 0731 is ~167 GB against the pair's 192 GB, tighter than the
      # preview's ~150 GB. Upstream runs 0.975 to claw back headroom;
      # if this OOMs, pin cudagraph capture sizes before lowering it.
      GPU_MEMORY_UTILIZATION: "0.975"
      LOAD_FORMAT: instanttensor
      INSTANTTENSOR_BACKEND: BUFFERED
