---
# Split-mode AI workflow: llama-swap on GPU 2 plus vLLM holding GPUs 0,1.
# Invoke with `-e ai_gpu_mode=split` (see Makefile deploy-ai-split).
#
# Order matters:
#   1. ai.yml deploys llama-swap with the split-mode GPU device list.
#   2. vllm.yml renders the vLLM compose at /opt/docker/vllm.
#   3. The trailing play starts the configured vLLM model profile.
#
# The profile defaults to the 0731 release, now the only checkpoint.
# The play below stops any other running model profile first, so the
# deploy is declarative: whatever was running before, the configured
# profile is what runs after. Every profile binds 11437, so without
# that step a switch fails on a port conflict and silently leaves the
# old checkpoint serving. See roles/vllm/README.md.
#
# The SGLang role and deploy/sglang.yml are kept in the repo for the
# day someone gets the NVFP4 + dsv4 backend past the strict-config
# loader; until then, vLLM is the path that actually serves DSV4 Flash.
- import_playbook: ai.yml
- import_playbook: vllm.yml

- name: Start configured vLLM model profile
  hosts: ai
  become: true
  gather_facts: false
  vars:
    vllm_split_profile: "{{ ai_split_vllm_profile | default('deepseek-v4-flash-0731') }}"
  tasks:
    # Every model profile binds the same host port, so a stale one left
    # running makes the next `up` fail to bind and quietly keeps serving
    # the wrong checkpoint. Stop the others first so the deploy is
    # declarative: after this play, the configured profile is the one
    # running, whatever was running before.
    - name: Find running vLLM model containers
      ansible.builtin.command:
        cmd: docker compose --profile all ps --status running --format '{% raw %}{{.Service}}{% endraw %}'
        chdir: "/opt/docker/vllm"
      register: _vllm_running
      changed_when: false

    - name: Stop vLLM model profiles other than {{ vllm_split_profile }}
      ansible.builtin.command:
        cmd: "docker compose --profile {{ item }} down"
        chdir: "/opt/docker/vllm"
      loop: "{{ _vllm_running.stdout_lines | difference([vllm_split_profile]) }}"

    - name: Start vLLM {{ vllm_split_profile }} profile
      ansible.builtin.command:
        cmd: "docker compose --profile {{ vllm_split_profile }} up -d"
        chdir: "/opt/docker/vllm"
      register: _vllm_up
      changed_when: >-
        'Started' in (_vllm_up.stderr | default(''))
        or 'Creating' in (_vllm_up.stderr | default(''))
        or 'Created' in (_vllm_up.stderr | default(''))
