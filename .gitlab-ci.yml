---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [plan, validate, report]

variables:
  GIT_DEPTH: "0"

plan-validation:
  stage: plan
  image: python:3.13-alpine
  interruptible: true
  before_script:
    - apk add --no-cache git
  script:
    - |
      mkdir -p ci-results
      base=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}
      if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
        base=$(git merge-base HEAD "origin/$CI_DEFAULT_BRANCH" 2>/dev/null || true)
      fi
      if [ -z "$base" ]; then
        base=0000000000000000000000000000000000000000
      fi
      full_argument=
      if [ "${CI_SUITE:-}" = full ] || [ "$CI_PIPELINE_SOURCE" = schedule ]; then
        full_argument=--full
      fi
      python3 ci/validation.py plan --base "$base" $full_argument \
        --output ci-results/selection.json --dotenv ci-results/selection.env
      python3 tests/test_validation.py
      if git cat-file -e "${base}^{commit}" 2>/dev/null \
          && ! git diff --quiet "$base"...HEAD; then
        python3 ci/validation.py fast --base "$base" --report ci-results/fast.json
      else
        python3 ci/validation.py fast --report ci-results/fast.json
      fi
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      dotenv: ci-results/selection.env
    paths:
      - ci-results/

.validation-job:
  stage: validate
  image: docker:29.4.0-cli
  tags: [docker, atelier-max]
  timeout: 30m
  interruptible: true
  before_script:
    - apk add --no-cache bash
  needs:
    - job: plan-validation
      artifacts: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-results/

static-validation:
  extends: .validation-job
  script:
    - |
      result_dir=ci-results/static
      mkdir -p "$result_dir"
      result=0
      if [ "$VALIDATION_STATIC" = true ]; then
        CI_RESULTS_DIR="$result_dir" bash ci/run static || result=$?
      else
        echo "Static validation not selected" | tee "$result_dir/skipped.txt"
      fi
      echo "$result" > "$result_dir/status"
      exit 0

lifecycle-validation:
  extends: .validation-job
  parallel:
    matrix:
      - GROUP: ["1", "2", "3", "4"]
  script:
    - |
      result_dir="ci-results/lifecycle-$GROUP"
      mkdir -p "$result_dir"
      case "$GROUP" in
        1) roles_csv=${VALIDATION_GROUP_1:-} ;;
        2) roles_csv=${VALIDATION_GROUP_2:-} ;;
        3) roles_csv=${VALIDATION_GROUP_3:-} ;;
        4) roles_csv=${VALIDATION_GROUP_4:-} ;;
      esac
      roles=$(printf '%s' "$roles_csv" | tr ',' ' ')
      result=0
      if [ -n "$roles" ]; then
        CI_RESULTS_DIR="$result_dir" bash ci/run lifecycle $roles || result=$?
      else
        echo "Lifecycle group $GROUP not selected" | tee "$result_dir/skipped.txt"
      fi
      echo "$result" > "$result_dir/status"
      exit 0

validation:
  stage: report
  image: alpine:3.22
  interruptible: true
  when: always
  needs:
    - job: plan-validation
      artifacts: true
    - job: static-validation
      artifacts: true
    - job: lifecycle-validation
      artifacts: true
  script:
    - |
      result=0
      for path in \
          ci-results/static/status \
          ci-results/lifecycle-1/status \
          ci-results/lifecycle-2/status \
          ci-results/lifecycle-3/status \
          ci-results/lifecycle-4/status; do
        if [ ! -f "$path" ]; then
          echo "Missing validation result: $path"
          result=1
        elif [ "$(cat "$path")" != 0 ]; then
          echo "Failed validation result: $path"
          result=1
        fi
      done
      find ci-results -type f \( -name '*timing.json' -o -name '*duration.json' \) \
        -print -exec cat {} \;
      exit "$result"
