---
# Docker base path
docker_base_path: /opt/docker

# Default image pull policy for docker_compose_v2 deploys across all roles.
# "always" checks the registry on every deploy so :latest and other mutable
# tags actually update; individual roles can still override per-deploy with
# -e docker_pull_policy=missing if a one-off freeze is needed.
docker_pull_policy: always

# Resolvers for containers that must reach LAN-only names such as
# registry.atelier.house. The daemon default (docker_dns_servers) is public
# DNS, which has no records for them. Services opt in with a Compose `dns:`
# list. The router answers internal and public names; the public resolver is
# only used when the router is unreachable.
docker_internal_dns_servers:
  - 192.168.1.1
  - 1.1.1.1
