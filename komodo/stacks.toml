[[action]]
name = "bentopdf-maintenance-check"
description = "Run fixed BentoPDF preflight and post-deployment maintenance gates"
tags = ["homelab", "bentopdf", "maintenance"]
[action.config]
failure_alert = true
webhook_enabled = false
file_contents = '''
const phase = String(ARGS.phase ?? '')
if (phase !== 'preflight' && phase !== 'postdeploy') {
  throw new Error('phase must be preflight or postdeploy')
}

let exitCode = 'Early exit without code'
await komodo.execute_server_terminal({
  server: 'Atelier',
  terminal: `bentopdf-maintenance-${phase}`,
  command: `/opt/docker/bentopdf/scripts/maintenance-check.sh ${phase}`,
  init: { command: 'bash', recreate: 'Always' },
}, {
  onLine: (line) => console.log(line),
  onFinish: (code) => { exitCode = code },
})
if (exitCode !== '0') {
  throw new Error(`BentoPDF ${phase} check failed with exit code ${exitCode}`)
}
'''

[[procedure]]
name = "maintain-bentopdf"
description = "Preflight, deploy, and verify the Git-pinned stateless BentoPDF stack"
tags = ["homelab", "bentopdf", "maintenance"]
[procedure.config]
schedule_enabled = false
failure_alert = true
webhook_enabled = false

[[procedure.config.stage]]
name = "Preflight"
executions = [
  { execution.type = "RunAction", execution.params.action = "bentopdf-maintenance-check", execution.params.args.phase = "preflight", enabled = true },
]

[[procedure.config.stage]]
name = "Deploy host-rendered stack"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "bentopdf", enabled = true },
]

[[procedure.config.stage]]
name = "Verify health and digest"
executions = [
  { execution.type = "RunAction", execution.params.action = "bentopdf-maintenance-check", execution.params.args.phase = "postdeploy", enabled = true },
]

[[action]]
name = "report-image-digest-updates"
description = "Check update-monitor stacks and send one digest-change or error report"
tags = ["homelab", "maintenance", "reporting"]
[action.config]
schedule_format = "Cron"
schedule = "0 0 9 ? * MON"
schedule_enabled = true
schedule_timezone = "America/Los_Angeles"
schedule_alert = false
failure_alert = true
webhook_enabled = false
file_contents = '''
const stacks = await komodo.read('ListStacks', {
  query: { tags: ['update-monitor'] },
})
stacks.sort((left, right) => left.name.localeCompare(right.name))

const changes: string[] = []
const errors: string[] = []
for (const stack of stacks) {
  try {
    const result = await komodo.write('CheckStackForUpdate', {
      stack: stack.name,
      skip_auto_update: true,
      wait_for_auto_update: true,
    })
    const changed = result.services.filter((service) => service.update_available)
    for (const service of changed) {
      changes.push(`${stack.name}/${service.service}: ${service.image}`)
    }
    console.log(`${stack.name}: ${changed.length} image change(s)`)
  } catch (error) {
    const message = error instanceof Error ? error.message : JSON.stringify(error)
    errors.push(`${stack.name}: ${message}`)
    console.error(`${stack.name}: ${message}`)
  }
}

if (changes.length === 0 && errors.length === 0) {
  console.log(`No image digest changes across ${stacks.length} monitored stacks`)
} else {
  const sections: string[] = []
  if (changes.length > 0) sections.push(`Changes:\n${changes.map((item) => `- ${item}`).join('\n')}`)
  if (errors.length > 0) sections.push(`Lookup failures:\n${errors.map((item) => `- ${item}`).join('\n')}`)
  const update = await komodo.execute_and_poll('SendAlert', {
    level: errors.length > 0 ? 'CRITICAL' : 'WARNING',
    message: 'Homelab image digest report',
    details: sections.join('\n\n'),
    alerters: ['homelab-operations'],
  })
  if (Array.isArray(update) || !update.success) {
    throw new Error('Failed to deliver image digest report')
  }
}
'''

