# Komodo Resource Sync declarations for Ansible-rendered compose stacks.
# Ansible remains the source of truth for /opt/docker/<stack>/compose.yaml
# and any env/config files. Komodo reads those host files and may redeploy
# them on demand, but it should not clone stack repos or auto-update images.

[[alerter]]
name = "homelab-operations"
description = "Operational alerts to the Discord destination shared with Gatus; see komodo/README.md."
tags = ["homelab", "operations"]
[alerter.config]
enabled = true
alert_types = [
  "ServerUnreachable",
  "ServerDisk",
  "StackStateChange",
  "BuildFailed",
  "RepoBuildFailed",
  "ProcedureFailed",
  "ActionFailed",
  "Custom",
]
[alerter.config.endpoint]
type = "Discord"
[alerter.config.endpoint.params]
url = "[[HOMELAB_DISCORD_WEBHOOK_URL]]"

[[stack]]
name = "traefik"
description = "Reverse proxy, TLS termination, and ACME certificates"
tags = ["homelab", "ansible", "nuc-mini", "infrastructure", "update-monitor"]
[stack.config]
server = "Atelier"
files_on_host = true
run_directory = "/opt/docker/traefik"
file_paths = ["compose.yaml"]
poll_for_updates = false
auto_update = false

[[stack]]
name = "line"
description = "Personal dashboard at atelier.house, built from source"
tags = ["homelab", "ansible", "nuc-mini"]
[stack.config]
server = "Atelier"
files_on_host = true
run_directory = "/opt/docker/line"
file_paths = ["compose.yaml"]
poll_for_updates = false
auto_update = false
# Line has no registry image: it is built from the git checkout Ansible
# maintains at ./source/line. Pulling would fail on `line:local`, so the
# stack builds instead.
auto_pull = false
run_build = true

