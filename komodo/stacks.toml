[[action]]
name = "verify-backup-status"
description = "Require fresh matching local, NAS, and Komodo Core backup artifacts"
tags = ["homelab", "backup", "verification"]
[action.config]
schedule_format = "Cron"
schedule = "0 0 4 * * ?"
schedule_enabled = true
schedule_timezone = "America/Los_Angeles"
schedule_alert = false
failure_alert = true
webhook_enabled = false
file_contents = '''
let exitCode = 'Early exit without code'
await komodo.execute_server_terminal({
  server: 'Atelier',
  terminal: 'verify-backup-status',
  command: 'docker exec -e BORG_DIRECT=true borgmatic /scripts/verify-backup-status.sh',
  init: { command: 'bash', recreate: 'Always' },
}, {
  onLine: (line) => console.log(line),
  onFinish: (code) => { exitCode = code },
})
if (exitCode !== '0') {
  throw new Error(`Backup status verification failed with exit code ${exitCode}`)
}
'''

